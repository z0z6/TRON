<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TRON Light Cycles 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            background-color: #050811;
            color: #e0f7fc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        .game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .canvas-wrapper {
            position: fixed;
            inset: 0;
            background-color: #000;
            border: 3px solid #00f3ff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }

        #tronCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 8, 17, 0.92);
            gap: 15px;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #overlay-title {
            font-size: clamp(1.5rem, 5vw, 2rem);
            color: #00f3ff;
            text-shadow: 0 0 15px #00f3ff;
            letter-spacing: 3px;
        }

        #overlay-msg {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            color: #e0f7fc;
            text-align: center;
            padding: 0 20px;
        }

        .btn-start {
            padding: clamp(10px, 3vw, 12px) clamp(24px, 6vw, 32px);
            background: rgba(0, 243, 255, 0.15);
            border: 2px solid #00f3ff;
            border-radius: 30px;
            color: #00f3ff;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        /* === STARTUP ROTATE MESSAGE === */
        .startup-rotate-message {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(5, 8, 17, 0.98);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 40px 20px;
            text-align: center;
        }

        .startup-rotate-message.active {
            display: flex;
        }

        .rotate-animation {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .phone-icon {
            position: absolute;
            width: 80px;
            height: 140px;
            border: 4px solid #00f3ff;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
            background: rgba(0, 243, 255, 0.1);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .phone-icon::after {
            content: '';
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: #00f3ff;
            border-radius: 2px;
        }

        .phone-icon.portrait {
            animation: phoneRotateOut 1.5s ease-in-out forwards;
        }

        .phone-icon.landscape {
            transform: translate(-50%, -50%) rotate(-90deg);
            border-color: #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
            background: rgba(255, 0, 85, 0.1);
            opacity: 0;
            animation: phoneRotateIn 1.5s ease-in-out forwards;
        }

        .phone-icon.landscape::after {
            background: #ff0055;
        }

        .arrow-rotate {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid transparent;
            border-top-color: #ff0055;
            border-right-color: #ff0055;
            border-radius: 50%;
            opacity: 0;
            animation: arrowSpin 1.5s ease-in-out forwards;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes phoneRotateOut {
            0%, 30% { opacity: 1; transform: translate(-50%, -50%) rotate(0deg); }
            70%, 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-90deg); }
        }

        @keyframes phoneRotateIn {
            0%, 30% { opacity: 0; transform: translate(-50%, -50%) rotate(-90deg); }
            70%, 100% { opacity: 1; transform: translate(-50%, -50%) rotate(-90deg); }
        }

        @keyframes arrowSpin {
            0%, 10% { opacity: 0; transform: translate(-50%, -50%) rotate(0deg); }
            50%, 60% { opacity: 1; transform: translate(-50%, -50%) rotate(-180deg); }
            90%, 100% { opacity: 0; transform: translate(-50%, -50%) rotate(-360deg); }
        }

        .glitch-text {
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
            letter-spacing: 4px;
            animation: glitch 1.5s ease-in-out;
        }

        .instruction-text {
            font-size: clamp(1rem, 3.5vw, 1.2rem);
            color: #e0f7fc;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
            max-width: 400px;
            line-height: 1.6;
        }

        .loading-bar {
            width: min(300px, 80vw);
            height: 4px;
            background: rgba(0, 243, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #00f3ff, #ff0055);
            animation: loadingProgress 1.5s ease-out forwards;
            width: 0;
        }

        @keyframes loadingProgress {
            0% { width: 0; }
            100% { width: 100%; }
        }

        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }

        /* === TOUCH CONTROLS === */
        .touch-controls {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .touch-controls { display: block; }
        }

        .dpad {
            position: absolute;
            right: max(20px, env(safe-area-inset-right, 20px));
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            width: min(160px, 25vw);
            height: min(160px, 25vw);
            pointer-events: auto;
        }

        .dpad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid rgba(0, 243, 255, 0.5);
            border-radius: 8px;
            color: #00f3ff;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            touch-action: none;
            user-select: none;
        }

        .dpad-btn:active, .dpad-btn.pressed {
            background: rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 14px rgba(0, 243, 255, 0.7);
        }

        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 3; }

        .fn-controls {
            position: absolute;
            left: max(20px, env(safe-area-inset-left, 20px));
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .fn-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: min(65px, 10vw);
            height: min(48px, 7vw);
            background: rgba(255, 0, 255, 0.1);
            border: 2px solid rgba(255, 0, 255, 0.5);
            border-radius: 8px;
            color: #ff77ff;
            touch-action: none;
            user-select: none;
        }

        .fn-btn:active, .fn-btn.pressed {
            background: rgba(255, 0, 255, 0.4);
            box-shadow: 0 0 14px rgba(255, 0, 255, 0.6);
        }

        .fn-icon { font-size: 1.2rem; }
        .fn-label { font-size: 0.6rem; font-weight: bold; }

        /* === SCOREBOARD === */
        .scoreboard {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 15;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
        }

        .score {
            text-shadow: 0 0 8px currentColor;
        }

        .p1-score { color: #00f3ff; }
        .p2-score { color: #ff0055; }
    </style>
</head>
<body>
    <div class="startup-rotate-message" id="startupRotateMessage">
        <div class="rotate-animation">
            <div class="phone-icon portrait"></div>
            <div class="arrow-rotate"></div>
            <div class="phone-icon landscape"></div>
        </div>
        <h2 class="glitch-text">OBRÓĆ URZĄDZENIE</h2>
        <p class="instruction-text">Aby kontynuować, obróć telefon do poziomu</p>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <div class="game-container">
        <div class="scoreboard">
            <div class="score p1-score">P1: <span id="p1-score">0</span></div>
            <div class="score p2-score">P2: <span id="p2-score">0</span></div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="tronCanvas"></canvas>
            <div id="overlay" class="overlay">
                <h2 id="overlay-title">SYSTEM READY</h2>
                <p id="overlay-msg">Kliknij przycisk lub naciśnij <strong>SPACJĘ</strong></p>
                <button id="start-btn" class="btn-start">URUCHOM CYKL</button>
            </div>
        </div>

        <div class="touch-controls" aria-hidden="true">
            <div class="dpad" id="dpad">
                <button type="button" class="dpad-btn dpad-up" data-dir="up">▲</button>
                <button type="button" class="dpad-btn dpad-left" data-dir="left">◀</button>
                <button type="button" class="dpad-btn dpad-right" data-dir="right">▶</button>
                <button type="button" class="dpad-btn dpad-down" data-dir="down">▼</button>
            </div>
            <div class="fn-controls">
                <button type="button" class="fn-btn" id="fnPause"><span class="fn-icon">⏸</span><span class="fn-label">PAUZA</span></button>
                <button type="button" class="fn-btn" id="fnRestart"><span class="fn-icon">↻</span><span class="fn-label">RESTART</span></button>
            </div>
        </div>
    </div>

    <script>
        // === STARTUP ROTATE MESSAGE ===
        (function() {
            const messageEl = document.getElementById('startupRotateMessage');
            const DISPLAY_DURATION = 1500;
            const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
            
            if (!isTouchDevice) {
                messageEl.style.display = 'none';
                return;
            }
            
            messageEl.classList.add('active');
            
            setTimeout(() => {
                messageEl.classList.remove('active');
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, 300);
            }, DISPLAY_DURATION);
        })();

        // === CANVAS SETUP ===
        const canvas = document.getElementById('tronCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');
        const p1ScoreEl = document.getElementById('p1-score');
        const p2ScoreEl = document.getElementById('p2-score');

        const GRID_SIZE = 20;
        let CELL_SIZE;

        function resizeCanvas() {
            const wrapper = document.querySelector('.canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            CELL_SIZE = canvas.width / GRID_SIZE;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let p1, p2, isRunning, isPaused, scores, gameLoop;

        function initGame() {
            p1 = { x: 5, y: 10, dx: 1, dy: 0, trail: [], color: '#00f3ff' };
            p2 = { x: 14, y: 10, dx: -1, dy: 0, trail: [], color: '#ff0055' };
            isRunning = false;
            isPaused = false;
            scores = { p1: 0, p2: 0 };
        }

        function startRound() {
            initGame();
            isRunning = true;
            overlay.classList.add('hidden');
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 100);
        }

        function update() {
            if (isPaused) return;

            p1.x += p1.dx;
            p1.y += p1.dy;
            p2.x += p2.dx;
            p2.y += p2.dy;

            p1.trail.push({ x: p1.x, y: p1.y });
            p2.trail.push({ x: p2.x, y: p2.y });

            if (checkCollision(p1) || checkCollision(p2)) {
                endRound();
            }

            draw();
        }

        function checkCollision(player) {
            if (player.x < 0 || player.x >= GRID_SIZE || player.y < 0 || player.y >= GRID_SIZE) {
                return true;
            }
            for (let i = 0; i < player.trail.length - 1; i++) {
                if (player.trail[i].x === player.x && player.trail[i].y === player.y) {
                    return true;
                }
            }
            return false;
        }

        function endRound() {
            isRunning = false;
            clearInterval(gameLoop);
            
            if (checkCollision(p1)) scores.p2++;
            if (checkCollision(p2)) scores.p1++;
            
            p1ScoreEl.textContent = scores.p1;
            p2ScoreEl.textContent = scores.p2;
            
            overlayTitle.textContent = "KONIEC RUNDY";
            overlayTitle.style.color = "#ff0055";
            overlayMsg.innerHTML = `Wynik: <span style="color:#00f3ff">${scores.p1}</span> - <span style="color:#ff0055">${scores.p2}</span>`;
            startBtn.textContent = "NASTĘPNA RUNDA";
            overlay.classList.remove('hidden');
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(0, 243, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            drawPlayer(p1);
            drawPlayer(p2);
        }

        function drawPlayer(player) {
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = player.color;
            player.trail.forEach(cell => {
                ctx.fillRect(cell.x * CELL_SIZE, cell.y * CELL_SIZE, CELL_SIZE - 2, CELL_SIZE - 2);
            });
            ctx.shadowBlur = 0;
        }

        function trySetPlayerDirection(player, dx, dy) {
            if (player.dx === -dx && player.dy === -dy) return;
            if (dx !== 0 && player.dx === dx) return;
            if (dy !== 0 && player.dy === dy) return;
            player.dx = dx;
            player.dy = dy;
        }

        function aiMove() {
            const directions = [
                { dx: 0, dy: -1 },
                { dx: 0, dy: 1 },
                { dx: -1, dy: 0 },
                { dx: 1, dy: 0 }
            ];
            
            const validMoves = directions.filter(dir => {
                const newX = p2.x + dir.dx;
                const newY = p2.y + dir.dy;
                return newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE;
            });
            
            if (validMoves.length > 0) {
                const move = validMoves[Math.floor(Math.random() * validMoves.length)];
                p2.dx = move.dx;
                p2.dy = move.dy;
            }
        }

        setInterval(() => {
            if (isRunning && !isPaused) aiMove();
        }, 200);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isRunning) startRound();
                else {
                    isPaused = !isPaused;
                    overlay.classList.toggle('hidden', !isPaused);
                    if (isPaused) {
                        overlayTitle.textContent = "PAUZA";
                        startBtn.textContent = "WZNOWIENIE";
                    }
                }
                return;
            }

            if (e.code === 'KeyR') {
                scores = { p1: 0, p2: 0 };
                p1ScoreEl.textContent = '0';
                p2ScoreEl.textContent = '0';
                startRound();
                return;
            }

            if (!isRunning || isPaused) return;

            if (e.code === 'ArrowUp') trySetPlayerDirection(p1, 0, -1);
            if (e.code === 'ArrowDown') trySetPlayerDirection(p1, 0, 1);
            if (e.code === 'ArrowLeft') trySetPlayerDirection(p1, -1, 0);
            if (e.code === 'ArrowRight') trySetPlayerDirection(p1, 1, 0);
        });

        document.querySelectorAll('.dpad-btn').forEach((btn) => {
            const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
            const [dx, dy] = DIRS[btn.dataset.dir];

            const press = (e) => {
                e.preventDefault();
                btn.classList.add('pressed');
                if (isRunning && !isPaused) trySetPlayerDirection(p1, dx, dy);
            };
            const release = (e) => {
                e.preventDefault();
                btn.classList.remove('pressed');
            };

            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('touchcancel', release, { passive: false });
        });

        document.getElementById('fnPause').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isRunning) {
                isPaused = !isPaused;
                overlay.classList.toggle('hidden', !isPaused);
            }
        }, { passive: false });

        document.getElementById('fnRestart').addEventListener('touchstart', (e) => {
            e.preventDefault();
            scores = { p1: 0, p2: 0 };
            p1ScoreEl.textContent = '0';
            p2ScoreEl.textContent = '0';
            startRound();
        }, { passive: false });

        startBtn.addEventListener('click', () => {
            if (!isRunning) startRound();
            else if (isPaused) {
                isPaused = false;
                overlay.classList.add('hidden');
            }
        });

        initGame();
        draw();
    </script>
</body>
</html>
