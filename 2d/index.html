<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TRON Light Cycles 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            background-color: #050811;
            color: #e0f7fc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        .game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .canvas-wrapper {
            position: fixed;
            inset: 0;
            background-color: #000;
            border: 4px solid #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5), inset 0 0 20px rgba(0, 243, 255, 0.3);
        }

        #tronCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 8, 17, 0.92);
            gap: 20px;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #overlay-title {
            font-size: clamp(2rem, 6vw, 3rem);
            color: #00f3ff;
            text-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff;
            letter-spacing: 4px;
        }

        #overlay-msg {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: #e0f7fc;
            text-align: center;
            padding: 0 20px;
        }

        .btn-start {
            padding: clamp(12px, 4vw, 16px) clamp(32px, 8vw, 48px);
            background: rgba(0, 243, 255, 0.15);
            border: 3px solid #00f3ff;
            border-radius: 40px;
            color: #00f3ff;
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
            transition: all 0.2s ease;
        }

        .btn-start:hover {
            background: rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.7);
        }

        /* === SCOREBOARD === */
        .scoreboard {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            z-index: 15;
            font-size: clamp(1.2rem, 3.5vw, 1.5rem);
            font-weight: bold;
        }

        .score {
            text-shadow: 0 0 10px currentColor;
        }

        .p1-score { color: #00f3ff; }
        .p2-score { color: #ff0055; }

        /* === TOUCH CONTROLS === */
        .touch-controls {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .touch-controls { display: block; }
        }

        .dpad {
            position: absolute;
            right: max(20px, env(safe-area-inset-right, 20px));
            top: 50%;
            transform: translateY(-50%);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: min(180px, 28vw);
            height: min(180px, 28vw);
            pointer-events: auto;
        }

        .dpad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 243, 255, 0.15);
            border: 2px solid rgba(0, 243, 255, 0.6);
            border-radius: 10px;
            color: #00f3ff;
            font-size: clamp(1.5rem, 5vw, 2rem);
            touch-action: none;
            user-select: none;
            transition: all 0.1s ease;
        }

        .dpad-btn:active, .dpad-btn.pressed {
            background: rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
        }

        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 3; }

        .fn-controls {
            position: absolute;
            left: max(20px, env(safe-area-inset-left, 20px));
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }

        .fn-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: min(75px, 12vw);
            height: min(55px, 9vw);
            background: rgba(255, 0, 255, 0.15);
            border: 2px solid rgba(255, 0, 255, 0.6);
            border-radius: 10px;
            color: #ff77ff;
            touch-action: none;
            user-select: none;
            transition: all 0.1s ease;
        }

        .fn-btn:active, .fn-btn.pressed {
            background: rgba(255, 0, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
        }

        .fn-icon { font-size: 1.5rem; }
        .fn-label { font-size: 0.7rem; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="scoreboard">
            <div class="score p1-score">P1: <span id="p1-score">0</span></div>
            <div class="score p2-score">P2: <span id="p2-score">0</span></div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="tronCanvas"></canvas>
            <div id="overlay" class="overlay">
                <h2 id="overlay-title">SYSTEM READY</h2>
                <p id="overlay-msg">Kliknij przycisk lub naciśnij <strong>SPACJĘ</strong></p>
                <button id="start-btn" class="btn-start">URUCHOM CYKL</button>
            </div>
        </div>

        <div class="touch-controls" aria-hidden="true">
            <div class="dpad" id="dpad">
                <button type="button" class="dpad-btn dpad-up" data-dir="up">▲</button>
                <button type="button" class="dpad-btn dpad-left" data-dir="left">◀</button>
                <button type="button" class="dpad-btn dpad-right" data-dir="right">▶</button>
                <button type="button" class="dpad-btn dpad-down" data-dir="down">▼</button>
            </div>
            <div class="fn-controls">
                <button type="button" class="fn-btn" id="fnPause"><span class="fn-icon">⏸</span><span class="fn-label">PAUZA</span></button>
                <button type="button" class="fn-btn" id="fnRestart"><span class="fn-icon">↻</span><span class="fn-label">RESTART</span></button>
            </div>
        </div>
    </div>

    <script>
        // === CANVAS SETUP ===
        const canvas = document.getElementById('tronCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');
        const p1ScoreEl = document.getElementById('p1-score');
        const p2ScoreEl = document.getElementById('p2-score');

        const GRID_SIZE = 50; // Zwiększona siatka = mniejsze ślady
        let CELL_SIZE;

        function resizeCanvas() {
            const wrapper = document.querySelector('.canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            CELL_SIZE = canvas.width / GRID_SIZE;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let p1, p2, isRunning, isPaused, scores, gameLoop;

        function initGame() {
            p1 = { x: 10, y: 25, dx: 1, dy: 0, trail: [], color: '#00f3ff' };
            p2 = { x: 40, y: 25, dx: -1, dy: 0, trail: [], color: '#ff0055' };
            isRunning = false;
            isPaused = false;
            scores = { p1: 0, p2: 0 };
        }

        function startRound() {
            initGame();
            isRunning = true;
            overlay.classList.add('hidden');
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 80); // Szybsza gra
        }

        function update() {
            if (isPaused) return;

            p1.x += p1.dx;
            p1.y += p1.dy;
            p2.x += p2.dx;
            p2.y += p2.dy;

            p1.trail.push({ x: p1.x, y: p1.y });
            p2.trail.push({ x: p2.x, y: p2.y });

            if (checkCollision(p1) || checkCollision(p2)) {
                endRound();
            }

            draw();
        }

        function checkCollision(player) {
            if (player.x < 0 || player.x >= GRID_SIZE || player.y < 0 || player.y >= GRID_SIZE) {
                return true;
            }
            for (let i = 0; i < player.trail.length - 1; i++) {
                if (player.trail[i].x === player.x && player.trail[i].y === player.y) {
                    return true;
                }
            }
            return false;
        }

        function endRound() {
            isRunning = false;
            clearInterval(gameLoop);
            
            if (checkCollision(p1)) scores.p2++;
            if (checkCollision(p2)) scores.p1++;
            
            p1ScoreEl.textContent = scores.p1;
            p2ScoreEl.textContent = scores.p2;
            
            overlayTitle.textContent = "KONIEC RUNDY";
            overlayTitle.style.color = "#ff0055";
            overlayMsg.innerHTML = `Wynik: <span style="color:#00f3ff">${scores.p1}</span> - <span style="color:#ff0055">${scores.p2}</span>`;
            startBtn.textContent = "NASTĘPNA RUNDA";
            overlay.classList.remove('hidden');
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Siatka
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            drawPlayer(p1);
            drawPlayer(p2);
        }

        function drawPlayer(player) {
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = player.color;
            player.trail.forEach(cell => {
                ctx.fillRect(cell.x * CELL_SIZE + 1, cell.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
            });
            ctx.shadowBlur = 0;
        }

        function trySetPlayerDirection(player, dx, dy) {
            if (player.dx === -dx && player.dy === -dy) return;
            if (dx !== 0 && player.dx === dx) return;
            if (dy !== 0 && player.dy === dy) return;
            player.dx = dx;
            player.dy = dy;
        }

        // === POPRAWIONE AI - unika kolizji ===
        function aiMove() {
            const directions = [
                { dx: 0, dy: -1 },
                { dx: 0, dy: 1 },
                { dx: -1, dy: 0 },
                { dx: 1, dy: 0 }
            ];
            
            // Filtruj bezpieczne kierunki
            const safeMoves = directions.filter(dir => {
                // Nie zawracaj
                if (dir.dx === -p2.dx && dir.dy === -p2.dy) return false;
                
                const newX = p2.x + dir.dx;
                const newY = p2.y + dir.dy;
                
                // Sprawdź ściany
                if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                    return false;
                }
                
                // Sprawdź własny ślad
                for (let i = 0; i < p2.trail.length; i++) {
                    if (p2.trail[i].x === newX && p2.trail[i].y === newY) {
                        return false;
                    }
                }
                
                // Sprawdź ślad gracza 1
                for (let i = 0; i < p1.trail.length; i++) {
                    if (p1.trail[i].x === newX && p1.trail[i].y === newY) {
                        return false;
                    }
                }
                
                return true;
            });
            
            // Wybierz losowy bezpieczny kierunek
            if (safeMoves.length > 0) {
                const move = safeMoves[Math.floor(Math.random() * safeMoves.length)];
                p2.dx = move.dx;
                p2.dy = move.dy;
            }
            // Jeśli brak bezpiecznych - kontynuuj (nieunikniona śmierć)
        }

        setInterval(() => {
            if (isRunning && !isPaused) aiMove();
        }, 150);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isRunning) startRound();
                else {
                    isPaused = !isPaused;
                    overlay.classList.toggle('hidden', !isPaused);
                    if (isPaused) {
                        overlayTitle.textContent = "PAUZA";
                        startBtn.textContent = "WZNOWIENIE";
                    }
                }
                return;
            }

            if (e.code === 'KeyR') {
                scores = { p1: 0, p2: 0 };
                p1ScoreEl.textContent = '0';
                p2ScoreEl.textContent = '0';
                startRound();
                return;
            }

            if (!isRunning || isPaused) return;

            if (e.code === 'ArrowUp') trySetPlayerDirection(p1, 0, -1);
            if (e.code === 'ArrowDown') trySetPlayerDirection(p1, 0, 1);
            if (e.code === 'ArrowLeft') trySetPlayerDirection(p1, -1, 0);
            if (e.code === 'ArrowRight') trySetPlayerDirection(p1, 1, 0);
        });

        document.querySelectorAll('.dpad-btn').forEach((btn) => {
            const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
            const [dx, dy] = DIRS[btn.dataset.dir];

            const press = (e) => {
                e.preventDefault();
                btn.classList.add('pressed');
                if (isRunning && !isPaused) trySetPlayerDirection(p1, dx, dy);
            };
            const release = (e) => {
                e.preventDefault();
                btn.classList.remove('pressed');
            };

            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('touchcancel', release, { passive: false });
        });

        document.getElementById('fnPause').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isRunning) {
                isPaused = !isPaused;
                overlay.classList.toggle('hidden', !isPaused);
            }
        }, { passive: false });

        document.getElementById('fnRestart').addEventListener('touchstart', (e) => {
            e.preventDefault();
            scores = { p1: 0, p2: 0 };
            p1ScoreEl.textContent = '0';
            p2ScoreEl.textContent = '0';
            startRound();
        }, { passive: false });

        startBtn.addEventListener('click', () => {
            if (!isRunning) startRound();
            else if (isPaused) {
                isPaused = false;
                overlay.classList.add('hidden');
            }
        });

        initGame();
        draw();
    </script>
</body>
</html>
