<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TRON Light Cycles 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* === MOTYW KOLORYSTYCZNY ===
               Domyślne wartości = TRON CLASSIC (dokładnie to, co było na
               sztywno wcześniej - więc bez wybranego motywu wygląd się nie
               zmienia). JS (theme-picker) nadpisuje je przy starcie/zmianie
               motywu. R/G/B osobno są potrzebne, bo CSS rgba() przyjmuje
               liczby, nie może przyjąć całego koloru przez var() jako jeden
               parametr. */
            --theme-p1: var(--theme-p1);
            --theme-p1-r: 0;
            --theme-p1-g: 243;
            --theme-p1-b: 255;
            --theme-p2: var(--theme-p2);
            --theme-p2-r: 255;
            --theme-p2-g: 0;
            --theme-p2-b: 85;
            --theme-bg: #050811;

            /* Rzeczywisty, POPRAWNIE zorientowany rozmiar pola gry - aktualizowany
               z JS. Dzięki temu elementy proporcjonalne (D-Pad, klawisze funkcyjne)
               skalują się względem prawdziwej wysokości/szerokości ekranu w trybie
               poziomym, zamiast surowych jednostek vw/vh, które ZAWSZE odnoszą się
               do fizycznego (nieobróconego) viewportu i ignorują transform poniżej. */
            --vp-w: 100vw;
            --vp-h: 100vh;

            /* Wspólny "komponent" D-Pada i klawiszy funkcyjnych - te same
               wartości w wersji 2D i 3D, żeby sterowanie wyglądało identycznie
               wszędzie. Marginesy po bokach pola gry są liczone NIEZALEŻNIE
               dla każdej strony (względem rozmiaru elementu, który tam stoi),
               więc D-Pad może być większy niż klawisze funkcyjne bez
               marnowania miejsca po stronie, gdzie stoi coś mniejszego. */
            --dpad-size: clamp(120px, calc(var(--vp-h) * 0.38), 165px);
            --side-margin-right: calc(var(--dpad-size) + 3px);
            /* Klawisze funkcyjne - 75% poprzedniego rozmiaru (mniejsze), co
               automatycznie zwęża lewy margines i oddaje tę przestrzeń polu
               gry. */
            --fn-btn-w: clamp(44px, calc(var(--vp-h) * 0.11), 56px);
            --fn-btn-h: clamp(32px, calc(var(--vp-h) * 0.079), 41px);
            --side-margin-left: calc(var(--fn-btn-w) + 6px);
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--theme-bg);
            color: #e0f7fc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        .game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .canvas-wrapper {
            position: fixed;
            inset: 0;
            background-color: var(--theme-bg);
            border: 4px solid var(--theme-p1);
            box-shadow: 0 0 30px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.5), inset 0 0 20px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.3);
        }

        /* Marginesy na sterowanie dotykowe zwężają pole gry TYLKO tam, gdzie
           D-Pad/klawisze funkcyjne faktycznie się pokazują (patrz .touch-controls
           poniżej) - na desktopie z myszką canvas zostaje pełnoekranowy. Lewy
           i prawy margines są NIEZALEŻNE (patrz --side-margin-left/-right) -
           pole gry rozciąga się bardziej w stronę mniejszych klawiszy funkcyjnych. */
        @media (hover: none) and (pointer: coarse) {
            .canvas-wrapper {
                inset: 0 var(--side-margin-right) 0 var(--side-margin-left);
            }
        }

        /* === EKRAN PODSUMOWANIA RUNDY (wynik, statystyki, rekordy) - ten
           sam wzorzec co w wersji 3D (src/index.html), pokazywany zamiast
           zwykłego #overlay po zakończeniu rundy. === */
        #gameOverOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 25;
            align-items: center;
            justify-content: center;
            background: rgba(3, 5, 12, 0.82);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e0f7fc;
            padding: 16px;
        }

        #gameOverOverlay.show { display: flex; }

        #gameOverOverlay .panel {
            width: min(420px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: linear-gradient(160deg, rgba(10, 14, 28, 0.97), rgba(6, 8, 18, 0.97));
            border: 1px solid rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.5);
            border-radius: 14px;
            padding: 22px 24px;
            box-shadow: 0 0 40px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.25);
            text-align: center;
        }

        /* Akcenty stylu per motyw - patrz analogiczne reguły w src/index.html */
        body.theme-matrix #gameOverOverlay .panel {
            font-family: 'Courier New', monospace;
            background:
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0px, rgba(0, 0, 0, 0.25) 1px, transparent 1px, transparent 3px),
                linear-gradient(160deg, rgba(4, 16, 8, 0.97), rgba(2, 10, 4, 0.97));
            border-radius: 4px;
        }

        body.theme-synthwave #gameOverOverlay .panel {
            background: linear-gradient(160deg, rgba(28, 8, 30, 0.97), rgba(10, 4, 20, 0.97));
        }

        body.theme-amber #gameOverOverlay .panel {
            background: linear-gradient(160deg, rgba(32, 16, 4, 0.97), rgba(16, 6, 2, 0.97));
        }

        body.theme-glacier #gameOverOverlay .panel {
            background: linear-gradient(160deg, rgba(8, 22, 32, 0.97), rgba(4, 12, 20, 0.97));
            border-width: 2px;
        }

        #gameOverOverlay h2 {
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            letter-spacing: 3px;
            margin-bottom: 4px;
        }

        #gameOverOverlay h2.won { color: var(--theme-p1); text-shadow: 0 0 20px var(--theme-p1); }
        #gameOverOverlay h2.lost { color: var(--theme-p2); text-shadow: 0 0 20px var(--theme-p2); }

        #gameOverOverlay .final-score {
            font-size: clamp(2.2rem, 9vw, 3rem);
            font-weight: bold;
            margin: 6px 0 2px;
        }

        #gameOverOverlay .record-badge {
            display: none;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffd24a;
            text-shadow: 0 0 10px rgba(255, 210, 74, 0.8);
            margin-bottom: 10px;
        }

        #gameOverOverlay .record-badge.show { display: block; }

        #gameOverOverlay .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
            margin: 14px 0;
            font-size: 0.85rem;
            text-align: left;
        }

        #gameOverOverlay .stats-grid .label { color: #8fa; opacity: 0.65; }
        #gameOverOverlay .stats-grid .value { font-weight: bold; text-align: right; }

        #gameOverOverlay .lifetime {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 0.72rem;
            color: rgba(224, 247, 252, 0.6);
        }

        #gameOverOverlay .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        #gameOverOverlay button {
            padding: 10px 22px;
            border-radius: 30px;
            border: 2px solid var(--theme-p1);
            background: rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.15);
            color: var(--theme-p1);
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 0.85rem;
            cursor: pointer;
            touch-action: manipulation;
        }

        #gameOverOverlay .countdown {
            margin-top: 10px;
            font-size: 0.68rem;
            color: rgba(224, 247, 252, 0.45);
        }

        /* === WINIETA + SKANLINIE (efekt "starego monitora CRT") ===
           Czysto kosmetyczny overlay nad canvasem - stały (bez migotania,
           celowo, żeby nie ryzykować dyskomfortu przy światłoczułości) -
           GPU-owy gradient, zero kosztu na klatkę w JS. */
        #crtOverlay {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.12) 0px,
                    rgba(0, 0, 0, 0.12) 1px,
                    transparent 1px,
                    transparent 3px
                ),
                radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.5) 100%);
        }

        #tronCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* === WYMUSZONA ORIENTACJA POZIOMA (Android/mobile) ===
           Obraca całą stronę o 90° przez CSS, niezależnie od systemowego
           ustawienia auto-rotacji Androida. .canvas-wrapper (position:fixed;
           inset:0) automatycznie "dziedziczy" już-obrócony układ, bo transform
           na body tworzy dla niego nowy containing block - stąd NIE wolno mu
           używać jednostek vw/vh (te zawsze ignorują transform rodzica). */
        html.force-landscape body {
            position: fixed;
            top: 50%;
            left: 50%;
            min-height: 0;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
            overflow: hidden;
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 8, 17, 0.92);
            gap: 20px;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #overlay-title {
            font-size: clamp(2rem, 6vw, 3rem);
            color: var(--theme-p1);
            text-shadow: 0 0 20px var(--theme-p1), 0 0 40px var(--theme-p1);
            letter-spacing: 4px;
        }

        #overlay-msg {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: #e0f7fc;
            text-align: center;
            padding: 0 20px;
        }

        .btn-start {
            padding: clamp(12px, 4vw, 16px) clamp(32px, 8vw, 48px);
            background: rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.15);
            border: 3px solid var(--theme-p1);
            border-radius: 40px;
            color: var(--theme-p1);
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.5);
            transition: all 0.2s ease;
        }

        .btn-start:hover {
            background: rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.3);
            box-shadow: 0 0 40px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.7);
        }

        /* === PRZEŁĄCZNIK MOTYWU KOLORYSTYCZNEGO === */
        .theme-picker {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 40;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(5, 8, 17, 0.7);
            border: 2px solid var(--theme-p1);
            color: var(--theme-p1);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px currentColor;
            cursor: pointer;
            touch-action: manipulation;
        }

        .theme-menu {
            display: none;
            flex-direction: column;
            gap: 4px;
            position: absolute;
            top: 48px;
            left: 0;
            background: rgba(5, 8, 17, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 8px;
            min-width: 170px;
        }

        .theme-menu.open { display: flex; }

        /* === PRZYCISK WYJŚCIA (Esc) - celowo stonowany (szary, bez
           kolorowej poświaty), żeby nie konkurował wizualnie z przełącznikiem
           motywu obok, mimo że stoi w tym samym rogu ekranu. === */
        .esc-btn {
            position: fixed;
            top: 16px;
            left: 64px;
            z-index: 40;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(5, 8, 17, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: rgba(224, 247, 252, 0.7);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.15s ease;
        }

        .esc-btn:hover, .esc-btn:active {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.5);
            color: #fff;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: #e0f7fc;
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            touch-action: manipulation;
        }

        .theme-option:hover, .theme-option:active {
            background: rgba(255, 255, 255, 0.08);
        }

        .theme-option.active {
            outline: 1px solid rgba(255, 255, 255, 0.35);
        }

        .theme-swatch {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }

        /* === SCOREBOARD === */
        .scoreboard {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            z-index: 15;
            font-size: clamp(1.2rem, 3.5vw, 1.5rem);
            font-weight: bold;
        }

        .score {
            text-shadow: 0 0 10px currentColor;
        }

        /* === HUD AKTYWNYCH POWER-UPÓW - mały rząd ikon z odliczaniem pod
           wynikiem każdego gracza (patrz updatePowerUpHud() w skrypcie). === */
        .effects-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 4px;
            font-size: 0.65rem;
            font-weight: normal;
            min-height: 16px;
        }

        .effects-row .effect-chip {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid currentColor;
            border-radius: 10px;
            padding: 1px 6px;
        }

        .p1-score { color: var(--theme-p1); }
        .p2-score { color: var(--theme-p2); }

        /* === KOMUNIKAT O OBROCIE EKRANU === */
        .rotate-message {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, rgba(12, 6, 26, 0.97) 0%, rgba(2, 2, 8, 0.99) 100%);
            opacity: 1;
            transition: opacity 0.32s ease;
        }

        .rotate-message.hide { opacity: 0; }

        /* CSS pokazuje komunikat NATYCHMIAST (zanim jeszcze zdąży wystartować
           JS), więc nie ma ryzyka mignięcia niezasłoniętej gry w pionie. */
        @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
            .rotate-message { display: flex; }
        }

        .rotate-message-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            padding: 0 32px;
        }

        .rotate-icon {
            width: 40px;
            height: 68px;
            border: 3px solid var(--theme-p1);
            border-radius: 9px;
            position: relative;
            background: rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.06);
            box-shadow: 0 0 16px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.65), 0 0 30px rgba(var(--theme-p2-r), var(--theme-p2-g), var(--theme-p2-b), 0.25), inset 0 0 10px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.25);
            animation: rotate-phone-hint 1.6s ease-in-out infinite;
        }

        .rotate-icon::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 7px;
            transform: translateX(-50%);
            width: 12px;
            height: 3px;
            border-radius: 2px;
            background: var(--theme-p1);
            box-shadow: 0 0 6px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.8);
        }

        @keyframes rotate-phone-hint {
            0%, 12%  { transform: rotate(0deg); }
            45%, 70% { transform: rotate(-90deg); }
            100%     { transform: rotate(-90deg); }
        }

        .rotate-text {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: clamp(0.95rem, 4vw, 1.15rem);
            font-weight: bold;
            letter-spacing: 2.5px;
            text-align: center;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--theme-p1), var(--theme-p2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 8px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.45)) drop-shadow(0 0 8px rgba(var(--theme-p2-r), var(--theme-p2-g), var(--theme-p2-b), 0.45));
            animation: rotate-text-pulse 1.6s ease-in-out infinite;
        }

        @keyframes rotate-text-pulse {
            0%, 100% { opacity: 0.75; }
            50%      { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .rotate-icon, .rotate-text { animation: none; }
            .rotate-icon { transform: rotate(-90deg); }
        }

        /* === TOUCH CONTROLS === */
        .touch-controls {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .touch-controls { display: block; }
        }

        /* Strefy sterowania - dedykowane, NIEWIELKIE marginesy po bokach pola
           gry, NIEZALEŻNE dla każdej strony (patrz --side-margin-left/-right).
           Pole gry (.canvas-wrapper) jest odpowiednio zwężone tymi samymi
           wartościami, więc motocykle nigdy nie jeżdżą "pod" przyciskami -
           to czytelnie oddzielone od rozgrywki strefy, nie nakładka na canvas. */
        .control-zone {
            position: fixed;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .control-zone-right { right: 0; width: var(--side-margin-right); }
        .control-zone-left { left: 0; width: var(--side-margin-left); }

        /* D-Pad - komponent WSPÓLNY dla 2D i 3D (identyczny rozmiar i styl,
           patrz --dpad-size). W 3D dostępny funkcjonalnie jest tylko skręt
           lewo/prawo, więc górna/dolna komórka siatki zostaje pusta - ale
           sam D-Pad (rozmiar, wygląd, pozycja w prawej strefie) jest ten sam. */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1px;
            width: var(--dpad-size);
            height: var(--dpad-size);
            pointer-events: auto;
        }

        .dpad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.15);
            border: 2px solid rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.6);
            border-radius: 10px;
            color: var(--theme-p1);
            font-size: clamp(1.5rem, 4.5vw, 2.1rem);
            touch-action: none;
            user-select: none;
            transition: all 0.1s ease;
        }

        .dpad-btn:active, .dpad-btn.pressed {
            background: rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.5);
            box-shadow: 0 0 20px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.8);
        }

        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 3; }

        /* Klawisze funkcyjne - komponent WSPÓLNY dla 2D i 3D, w lewej strefie. */
        .fn-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }

        .fn-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: var(--fn-btn-w);
            height: var(--fn-btn-h);
            background: rgba(var(--theme-p2-r), var(--theme-p2-g), var(--theme-p2-b), 0.15);
            border: 2px solid rgba(var(--theme-p2-r), var(--theme-p2-g), var(--theme-p2-b), 0.6);
            border-radius: 10px;
            color: #ff77ff;
            touch-action: none;
            user-select: none;
            transition: all 0.1s ease;
        }

        .fn-btn:active, .fn-btn.pressed {
            background: rgba(var(--theme-p2-r), var(--theme-p2-g), var(--theme-p2-b), 0.5);
            box-shadow: 0 0 20px rgba(var(--theme-p2-r), var(--theme-p2-g), var(--theme-p2-b), 0.8);
        }

        .fn-icon { font-size: 0.98rem; }

           na ekranie, żeby dało się go odczytać/zrobić zrzut ekranu bez

        #errorBanner.show { display: block; }
    </style>
</head>
<body>
    <div id="errorBanner"></div>
    <script>
        // === ŁAPACZ BŁĘDÓW - musi być pierwszym skryptem w <body> ===
        (function () {
            var banner = document.getElementById('errorBanner');
            function show(msg) {
                banner.textContent += (banner.textContent ? '\n\n' : '') + msg;
                banner.classList.add('show');
            }
            window.addEventListener('error', function (e) {
                show('BŁĄD JS: ' + e.message + '\n  w ' + (e.filename || '?') + ':' + e.lineno + ':' + e.colno);
            });
            window.addEventListener('unhandledrejection', function (e) {
                show('NIEOBSŁUŻONY BŁĄD (Promise): ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
            });
        })();
    </script>
    <script>
        // === MOTYW KOLORYSTYCZNY ===
        // Musi wystartować jak najwcześniej (przed resztą gry) - inne skrypty
        // (initGame, draw) czytają window.__tronTheme przy pierwszym użyciu.
        (function () {
            const THEMES = {
                classic:   { name: 'TRON CLASSIC', p1: '#00f3ff', p2: '#ff0055', bg: '#050811' },
                synthwave: { name: 'SYNTHWAVE',    p1: '#ff2f9e', p2: '#ffd23f', bg: '#0c0420' },
                matrix:    { name: 'MATRIX',       p1: '#39ff14', p2: '#0d7a3f', bg: '#000f05' },
                amber:     { name: 'AMBER',        p1: '#ff8c00', p2: '#ff2e2e', bg: '#1a0800' },
                glacier:   { name: 'GLACIER',      p1: '#4fd8ff', p2: '#ffffff', bg: '#001522' }
            };

            function hexToRgb(hex) {
                const h = hex.replace('#', '');
                return {
                    r: parseInt(h.substring(0, 2), 16),
                    g: parseInt(h.substring(2, 4), 16),
                    b: parseInt(h.substring(4, 6), 16)
                };
            }

            function hexToRgba(hex, alpha) {
                const c = hexToRgb(hex);
                return `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`;
            }
            window.__tronHexToRgba = hexToRgba;
            window.__TRON_THEMES = THEMES;

            function applyTheme(key) {
                const theme = THEMES[key] || THEMES.classic;
                const root = document.documentElement;
                const p1 = hexToRgb(theme.p1);
                const p2 = hexToRgb(theme.p2);

                root.style.setProperty('--theme-p1', theme.p1);
                root.style.setProperty('--theme-p1-r', p1.r);
                root.style.setProperty('--theme-p1-g', p1.g);
                root.style.setProperty('--theme-p1-b', p1.b);
                root.style.setProperty('--theme-p2', theme.p2);
                root.style.setProperty('--theme-p2-r', p2.r);
                root.style.setProperty('--theme-p2-g', p2.g);
                root.style.setProperty('--theme-p2-b', p2.b);
                root.style.setProperty('--theme-bg', theme.bg);

                // Klasa na <body> (theme-classic/theme-synthwave/...) - poza
                // samymi kolorami (--theme-p1 itd., już podpięte wszędzie)
                // pozwala dodać per-motyw akcenty stylu (czcionka, wzór tła
                // panelu) tam, gdzie sam kolor nie wystarczy - patrz np.
                // #gameOverOverlay.panel niżej.
                document.body.className = document.body.className
                    .replace(/\btheme-\w+\b/g, '')
                    .trim();
                document.body.classList.add(`theme-${key}`);

                document.querySelectorAll('.theme-option').forEach((btn) => {
                    btn.classList.toggle('active', btn.dataset.theme === key);
                });

                window.__tronTheme = theme;
                window.__tronThemeKey = key;
                try { localStorage.setItem('tron-theme', key); } catch (e) {}
                window.dispatchEvent(new CustomEvent('tron-theme-change', { detail: theme }));
            }
            window.__applyTronTheme = applyTheme;

            let savedKey = 'classic';
            try { savedKey = localStorage.getItem('tron-theme') || 'classic'; } catch (e) {}
            if (!THEMES[savedKey]) savedKey = 'classic';
            applyTheme(savedKey);

            // Menu i przyciski jeszcze nie istnieją w DOM w tym momencie
            // (skrypt jest na samej górze body) - podłączamy listenery po
            // wyrenderowaniu reszty markupu.
            document.addEventListener('DOMContentLoaded', function () {
                const toggle = document.getElementById('themeToggle');
                const menu = document.getElementById('themeMenu');
                if (!toggle || !menu) return;

                toggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                menu.querySelectorAll('.theme-option').forEach((btn) => {
                    btn.addEventListener('click', function () {
                        applyTheme(btn.dataset.theme);
                        menu.classList.remove('open');
                    });
                });
                document.addEventListener('click', function () {
                    menu.classList.remove('open');
                });

                document.querySelectorAll('.theme-option').forEach((btn) => {
                    btn.classList.toggle('active', btn.dataset.theme === window.__tronThemeKey);
                });
            });
        })();
    </script>

    <script>
        // === WYMUSZENIE ORIENTACJI POZIOMEJ ===
        // Musi wystartować jak najwcześniej (przed resztą gry), żeby zdążyć
        // policzyć --vp-w/--vp-h zanim cokolwiek się narysuje, i żeby po
        // ukryciu komunikatu bezwarunkowo wymusić landscape - niezależnie od
        // systemowego ustawienia auto-rotacji Androida.
        (function () {
            function isTouchDevice() {
                return window.matchMedia('(hover: none) and (pointer: coarse)').matches;
            }

            function computeSize() {
                var w = window.innerWidth, h = window.innerHeight;
                var portrait = h > w;
                var forced = isTouchDevice() && portrait;
                return { forced: forced, width: forced ? h : w, height: forced ? w : h };
            }

            window.__getRenderSize = computeSize;

            // Wartości startowe dla --vp-w/--vp-h, zanim jeszcze cokolwiek
            // wymusimy (żeby proporcjonalne klawisze miały sens od pierwszej klatki).
            document.documentElement.style.setProperty('--vp-w', window.innerWidth + 'px');
            document.documentElement.style.setProperty('--vp-h', window.innerHeight + 'px');

            function applyLayout() {
                var s = computeSize();
                var root = document.documentElement;
                if (s.forced) {
                    root.classList.add('force-landscape');
                    document.body.style.width = s.width + 'px';
                    document.body.style.height = s.height + 'px';
                } else {
                    root.classList.remove('force-landscape');
                    document.body.style.width = '';
                    document.body.style.height = '';
                }
                root.style.setProperty('--vp-w', s.width + 'px');
                root.style.setProperty('--vp-h', s.height + 'px');
                window.dispatchEvent(new Event('game-viewport-resize'));
            }

            function finishHint() {
                var hint = document.getElementById('rotateMessage');
                if (hint) {
                    hint.classList.add('hide');
                    window.setTimeout(function () {
                        hint.style.display = 'none';
                        applyLayout();
                    }, 320);
                } else {
                    applyLayout();
                }
            }

            // Komunikat (jeśli w ogóle widoczny - o tym decyduje CSS
            // media query orientation:portrait) trzyma się ok. 1,4s, potem
            // znika, a wyświetlacz bezwarunkowo przechodzi w tryb poziomy.
            if (isTouchDevice()) {
                window.setTimeout(finishHint, 1400);
            }

            window.addEventListener('resize', applyLayout);
            window.addEventListener('orientationchange', applyLayout);
        })();
    </script>

    <script>
        // === CANVAS SETUP ===
        const canvas = document.getElementById('tronCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');
        const p1ScoreEl = document.getElementById('p1-score');
        const p2ScoreEl = document.getElementById('p2-score');
        const p1EffectsEl = document.getElementById('p1-effects');
        const p2EffectsEl = document.getElementById('p2-effects');

        const gameOverOverlayEl = document.getElementById('gameOverOverlay');
        const gameOverTitleEl = document.getElementById('gameOverTitle');
        const gameOverScoreEl = document.getElementById('gameOverScore');
        const gameOverRecordBadgeEl = document.getElementById('gameOverRecordBadge');
        const gameOverStatsGridEl = document.getElementById('gameOverStatsGrid');
        const gameOverLifetimeEl = document.getElementById('gameOverLifetime');
        const gameOverCountdownEl = document.getElementById('gameOverCountdown');
        const gameOverContinueBtnEl = document.getElementById('gameOverContinueBtn');

        // === POWER-UPY === (te same 4 typy i te same efekty co w trybie 3D
        // - src/PowerUpSystem.js: tarcza=pełna nietykalność, duch=przenika
        // przez ślady ale NIE przez ścianę, prędkość=szybszy ruch, bomba=
        // natychmiast czyści fragment śladu przeciwnika. Tak jak w 3D, TYLKO
        // gracz (p1) je zbiera - AI (p2) jest na nie kompletnie obojętne,
        // nigdy ich nie szuka ani nie unika.)
        const POWERUP_TYPES = {
            shield: { color: '#39ff6e', duration: 5000, symbol: '🛡' },
            speed:  { color: '#ffe93b', duration: 3000, symbol: '⚡' },
            ghost:  { color: '#ff5df0', duration: 4000, symbol: '👻' },
            bomb:   { color: '#ff4d4d', duration: 0,    symbol: '💣' }
        };
        const POWERUP_SPAWN_INTERVAL = 5000;
        const POWERUP_MAX = 4;
        const POWERUP_LIFETIME = 15000;
        let powerUps = [];
        let lastPowerUpSpawn = 0;
        let powerUpsCollectedThisRound = 0;

        // === REKORDY (localStorage) === - trwają między sesjami, w
        // odróżnieniu od `scores` (wynik bieżącej sesji, resetowany tylko
        // pełnym przeładowaniem strony - bez zmian względem wcześniej).
        const RECORDS_KEY = 'tron2d-records';
        function loadRecords() {
            try {
                return Object.assign({ longestRound: 0, bestStreak: 0, gamesPlayed: 0, p1Wins: 0 }, JSON.parse(localStorage.getItem(RECORDS_KEY)));
            } catch (e) {
                return { longestRound: 0, bestStreak: 0, gamesPlayed: 0, p1Wins: 0 };
            }
        }
        function saveRecords() {
            try { localStorage.setItem(RECORDS_KEY, JSON.stringify(records)); } catch (e) {}
        }
        let records = loadRecords();
        let currentStreak = 0;
        let roundStartTime = 0;
        let gameOverAutoTimer = null;

        const GRID_SIZE = 50; // Zwiększona siatka = mniejsze ślady
        // Osobne wymiary komórki dla X/Y - siatka ROZCIĄGA SIĘ na cały
        // prostokąt canvasu (bez zawijania/przycinania), niezależnie od
        // proporcji ekranu - tak jak wymaga tego pełnoekranowy tryb poziomy.
        let CELL_W, CELL_H;

        function resizeCanvas() {
            const wrapper = document.querySelector('.canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            CELL_W = canvas.width / GRID_SIZE;
            CELL_H = canvas.height / GRID_SIZE;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        // Wymuszenie/zdjęcie orientacji poziomej zmienia rozmiar .canvas-wrapper
        // bez wywoływania natywnego zdarzenia 'resize' - trzeba przeliczyć ręcznie.
        window.addEventListener('game-viewport-resize', resizeCanvas);

        let p1, p2, isRunning, isPaused, scores, gameLoop;
        // --- Efekty wizualne (niezależne od stałego kroku logiki 80ms -
        // patrz renderLoop() na dole pliku, który je aktualizuje i rysuje
        // co klatkę ekranu, żeby wybuch/potrząśnięcie były płynne). ---
        let explosion = null;   // { particles: [...], color } - wybuch derezz przy kolizji
        let shakeUntil = 0;     // performance.now(), do kiedy potrząsać ekranem
        let flashStartTime = 0; // performance.now() startu rundy - krótki błysk "boot-up"
        let lastFrameTime = performance.now();
        scores = { p1: 0, p2: 0 }; // Wynik trwa przez kolejne rundy, resetuje go tylko pełny restart.

        function initGame() {
            const theme = window.__tronTheme || { p1: '#00f3ff', p2: '#ff0055' };
            p1 = { x: 10, y: 25, dx: 1, dy: 0, trail: [], color: theme.p1, shieldUntil: 0, ghostUntil: 0, speedUntil: 0 };
            p2 = { x: 40, y: 25, dx: -1, dy: 0, trail: [], color: theme.p2, shieldUntil: 0, ghostUntil: 0, speedUntil: 0 };
            isRunning = false;
            isPaused = false;
            powerUps = [];
            lastPowerUpSpawn = performance.now();
            powerUpsCollectedThisRound = 0;
            roundStartTime = performance.now();
            updatePowerUpHud();
        }

        function startRound() {
            hideGameOverOverlay();
            initGame();
            isRunning = true;
            overlay.classList.add('hidden');
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 80); // Szybsza gra
            flashStartTime = performance.now(); // krótki błysk "boot-up" na starcie rundy
        }

        function update() {
            if (isPaused) return;

            // AI decyduje o kierunku TUŻ przed ruchem - w tym samym kroku co
            // przesunięcie pozycji (patrz usunięty niżej niezsynchronizowany
            // interwał AI). Wcześniej aiMove() był wywoływany na osobnym
            // timerze co 150ms, podczas gdy fizyka rusza co 80ms - te dwa
            // okresy nie są swoimi wielokrotnościami, więc average co ~1,9
            // ruchu AI podejmowało JEDNĄ decyzję na DWA pola do przodu, a
            // sprawdzenie bezpieczeństwa w aiMove() obejmuje tylko jedno pole.
            // Efekt: AI regularnie "na ślepo" wjeżdżało drugim polem w
            // ścianę lub własny ślad. Wywołanie tu, raz na każdy fizyczny
            // ruch, usuwa tę lukę całkowicie.
            aiMove();

            const p1Dead = movePlayerStep(p1, p2);
            const p2Dead = movePlayerStep(p2, p1);

            updatePowerUps();
            updatePowerUpHud();

            if (p1Dead || p2Dead) {
                endRound();
            }
        }

        // Przesuwa gracza o 1 pole (albo 2, przy aktywnym power-upie
        // prędkości) i sprawdza kolizję PO KAŻDYM pojedynczym polu, nie
        // tylko na końcu - inaczej boost mógłby "przeskoczyć" przez ścianę w
        // pośrednim kroku bez wykrycia (checkCollision patrzy tylko na
        // BIEŻĄCĄ pozycję gracza, więc bez tego pośredni krok nigdy nie
        // zostałby sprawdzony).
        function movePlayerStep(player, opponent) {
            const boosted = player.speedUntil && performance.now() < player.speedUntil;
            const steps = boosted ? 2 : 1;
            for (let s = 0; s < steps; s++) {
                player.x += player.dx;
                player.y += player.dy;
                player.trail.push({ x: player.x, y: player.y });
                if (checkCollision(player, opponent)) return true;
            }
            return false;
        }

        function checkCollision(player, opponent) {
            const outOfBounds = player.x < 0 || player.x >= GRID_SIZE || player.y < 0 || player.y >= GRID_SIZE;

            let hitTrail = false;
            if (!outOfBounds) {
                for (let i = 0; i < player.trail.length - 1; i++) {
                    if (player.trail[i].x === player.x && player.trail[i].y === player.y) {
                        hitTrail = true;
                        break;
                    }
                }
                // Kolizja z przeciwnikiem - jego cały ślad, WŁĄCZNIE z pozycją
                // dopiero co dodaną w tym samym kroku (żeby wykryć też zderzenie
                // czołowe, gdy obaj gracze wjadą na to samo pole jednocześnie).
                if (!hitTrail) {
                    for (let i = 0; i < opponent.trail.length; i++) {
                        if (opponent.trail[i].x === player.x && opponent.trail[i].y === player.y) {
                            hitTrail = true;
                            break;
                        }
                    }
                }
            }

            // Tarcza daje pełną nietykalność (włącznie ze ścianą). Duch
            // przenika przez ślady, ale NIE chroni przed wyjechaniem poza
            // granicę planszy - dokładnie te same zasady co w 3D
            // (src/Game.js#checkCollisions).
            const now = performance.now();
            if (player.shieldUntil && now < player.shieldUntil) return false;
            if (player.ghostUntil && now < player.ghostUntil && hitTrail && !outOfBounds) return false;

            return outOfBounds || hitTrail;
        }

        function endRound() {
            isRunning = false;
            clearInterval(gameLoop);
            
            const p1Crashed = checkCollision(p1, p2);
            const p2Crashed = checkCollision(p2, p1);
            if (p1Crashed) scores.p2++;
            if (p2Crashed) scores.p1++;

            // Wybuch derezz w miejscu zderzenia - przy czołówce (obaj naraz)
            // dwa wybuchy, każdy w kolorze swojego gracza.
            if (p1Crashed) spawnExplosion(p1.x * CELL_W + CELL_W / 2, p1.y * CELL_H + CELL_H / 2, p1.color);
            if (p2Crashed) spawnExplosion(p2.x * CELL_W + CELL_W / 2, p2.y * CELL_H + CELL_H / 2, p2.color);
            shakeUntil = performance.now() + 320;
            
            p1ScoreEl.textContent = scores.p1;
            p2ScoreEl.textContent = scores.p2;

            showGameOverOverlay(p1Crashed, p2Crashed);
        }

        // === EKRAN PODSUMOWANIA RUNDY === (ten sam wzorzec co w 3D -
        // src/main.js#showGameOverOverlay - wynik, statystyki, rekord,
        // auto-restart po 9s). P1 to zawsze gracz (P2 to AI), więc "WYGRANA/
        // PRZEGRANA" liczone jest z jego perspektywy.
        function showGameOverOverlay(p1Crashed, p2Crashed) {
            const draw = p1Crashed && p2Crashed;
            const won = p2Crashed && !p1Crashed;
            const roundDuration = (performance.now() - roundStartTime) / 1000;

            gameOverTitleEl.textContent = draw ? 'REMIS' : (won ? 'WYGRANA' : 'PRZEGRANA');
            gameOverTitleEl.className = draw ? '' : (won ? 'won' : 'lost');
            gameOverScoreEl.textContent = `${scores.p1} : ${scores.p2}`;

            records.gamesPlayed++;
            if (won) {
                currentStreak++;
                records.p1Wins++;
            } else if (!draw) {
                currentStreak = 0;
            }
            let isRecord = false;
            if (roundDuration > records.longestRound) { records.longestRound = roundDuration; isRecord = true; }
            if (currentStreak > records.bestStreak) { records.bestStreak = currentStreak; isRecord = true; }
            saveRecords();

            gameOverRecordBadgeEl.classList.toggle('show', isRecord);

            gameOverStatsGridEl.innerHTML = '';
            const rows = [
                ['Czas rundy', `${roundDuration.toFixed(1)}s`],
                ['Power-upy', powerUpsCollectedThisRound],
                ['Passa zwycięstw', currentStreak],
                ['Rekord passy', records.bestStreak]
            ];
            for (const [label, value] of rows) {
                const l = document.createElement('div');
                l.className = 'label';
                l.textContent = label;
                const v = document.createElement('div');
                v.className = 'value';
                v.textContent = value;
                gameOverStatsGridEl.appendChild(l);
                gameOverStatsGridEl.appendChild(v);
            }

            gameOverLifetimeEl.textContent =
                `Rekord rundy: ${records.longestRound.toFixed(1)}s · Rozegranych: ${records.gamesPlayed} · Wygranych P1: ${records.p1Wins}`;

            gameOverCountdownEl.textContent = 'Kolejna runda zacznie się automatycznie za chwilę...';
            gameOverOverlayEl.classList.add('show');

            if (gameOverAutoTimer) clearTimeout(gameOverAutoTimer);
            gameOverAutoTimer = setTimeout(() => {
                gameOverAutoTimer = null;
                startRound();
            }, 9000);
        }

        function hideGameOverOverlay() {
            gameOverOverlayEl.classList.remove('show');
            if (gameOverAutoTimer) {
                clearTimeout(gameOverAutoTimer);
                gameOverAutoTimer = null;
            }
        }

        gameOverContinueBtnEl.addEventListener('click', startRound);

        function draw() {
            const theme = window.__tronTheme || { p1: '#00f3ff', p2: '#ff0055', bg: '#050811' };
            const now = performance.now();

            ctx.save();

            // Potrząśnięcie ekranem przy kolizji - zanikające wraz z upływem
            // czasu od shakeUntil (patrz endRound/spawnExplosion).
            if (now < shakeUntil) {
                const remaining = (shakeUntil - now) / 320;
                const mag = 7 * remaining;
                ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
            }

            ctx.fillStyle = theme.bg || '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Siatka - delikatnie "oddycha" (pulsująca alpha), żeby tło nie
            // było całkowicie statyczne nawet poza rundą.
            const pulse = 0.06 + Math.sin(now / 1200) * 0.03;
            ctx.strokeStyle = window.__tronHexToRgba ? window.__tronHexToRgba(theme.p1, pulse) : `rgba(0, 243, 255, ${pulse})`;
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_W, 0);
                ctx.lineTo(i * CELL_W, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_H);
                ctx.lineTo(canvas.width, i * CELL_H);
                ctx.stroke();
            }

            drawPowerUps();
            drawRipple(p1);
            drawRipple(p2);
            drawPlayer(p1);
            drawPlayer(p2);
            drawExplosion();

            // Krótki, jednorazowy błysk przy starcie rundy ("boot-up") -
            // celowo krótki i niezbyt jasny, żeby był efektowny, ale nie
            // migotał (patrz uwaga o światłoczułości przy #crtOverlay).
            const flashElapsed = (now - flashStartTime) / 1000;
            if (flashElapsed >= 0 && flashElapsed < 0.35) {
                const alpha = (1 - flashElapsed / 0.35) * 0.35;
                ctx.fillStyle = window.__tronHexToRgba ? window.__tronHexToRgba(theme.p1, alpha) : `rgba(255,255,255,${alpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.restore();
        }

        // Fala światła pod motocyklem - odpowiednik efektu z wersji 3D
        // (grid.frag) przełożony na canvas 2D: kilka pierścieni sonaru
        // rozchodzących się z bieżącej pozycji gracza, w jego kolorze z
        // motywu. performance.now() zamiast licznika ticków, żeby faza fali
        // była płynna niezależnie od tego, jak często draw() jest wołane.
        function drawRipple(player) {
            const cx = player.x * CELL_W + CELL_W / 2;
            const cy = player.y * CELL_H + CELL_H / 2;
            const time = performance.now() / 1000;
            const maxRadius = Math.max(CELL_W, CELL_H) * 3.0; // było 3.5 - ciaśniejszy zasięg
            const ringCount = 2; // było 3 - mniej "gęsto"

            for (let i = 0; i < ringCount; i++) {
                const phase = (time * 0.6 + i / ringCount) % 1;
                const radius = phase * maxRadius;
                const alpha = (1 - phase) * 0.3; // było 0.45 - subtelniejsze pierścienie

                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.strokeStyle = window.__tronHexToRgba
                    ? window.__tronHexToRgba(player.color, alpha)
                    : `rgba(255, 255, 255, ${alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function drawPlayer(player) {
            const now = performance.now();
            const len = player.trail.length;
            const ghostActive = player.ghostUntil && now < player.ghostUntil;
            const ghostAlpha = ghostActive ? 0.5 : 1; // duch - przenika przez ślady, więc rysujemy go półprzezroczyście

            // Ogon blaknie w stronę tyłu (kometa) zamiast być jednolitą
            // wstęgą - tylko ostatnie FADE_WINDOW komórek liczy alpha,
            // starsze (już całkiem "dojrzałe") rysują się w pełnej
            // nieprzezroczystości bez dodatkowych obliczeń.
            const FADE_WINDOW = 40;
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 5;
            player.trail.forEach((cell, i) => {
                const distFromHead = len - 1 - i;
                const fadeAlpha = distFromHead < FADE_WINDOW
                    ? 0.35 + 0.65 * (1 - distFromHead / FADE_WINDOW)
                    : 1;
                ctx.globalAlpha = fadeAlpha * ghostAlpha;
                ctx.fillStyle = player.color;
                ctx.fillRect(cell.x * CELL_W + 1, cell.y * CELL_H + 1, CELL_W - 2, CELL_H - 2);
            });
            ctx.globalAlpha = 1;

            // Głowa motocykla - wyraźnie jaśniejsza (większy blur) niż ślad,
            // z małym białym "gorącym" rdzeniem pośrodku - czytelnie
            // odróżnia przód pojazdu od reszty wstęgi.
            const head = player.trail[len - 1];
            if (head) {
                const hx = head.x * CELL_W + CELL_W / 2;
                const hy = head.y * CELL_H + CELL_H / 2;
                const r = Math.max(CELL_W, CELL_H) * 0.65;

                ctx.globalAlpha = ghostAlpha;
                ctx.shadowBlur = 14;
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.arc(hx, hy, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.arc(hx, hy, r * 0.38, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                // Tarcza - dodatkowy, pulsujący biały pierścień wokół głowy.
                if (player.shieldUntil && now < player.shieldUntil) {
                    const shieldPulse = 1 + Math.sin(now / 150) * 0.1;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(hx, hy, r * 1.5 * shieldPulse, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            ctx.shadowBlur = 0;
        }

        // === POWER-UPY: RYSOWANIE, SPAWN, ZBIERANIE, EFEKTY ===
        function drawPowerUps() {
            const now = performance.now();
            for (const pu of powerUps) {
                const config = POWERUP_TYPES[pu.type];
                const cx = pu.x * CELL_W + CELL_W / 2;
                const cy = pu.y * CELL_H + CELL_H / 2;
                const pulse = 1 + Math.sin(now / 200) * 0.15;
                const r = Math.max(CELL_W, CELL_H) * 0.55 * pulse;

                ctx.save();
                ctx.strokeStyle = config.color;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = config.color;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.font = `${Math.max(10, Math.floor(r * 1.1))}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(config.symbol, cx, cy);
                ctx.restore();
            }
        }

        function trailHasCell(trail, x, y) {
            for (let i = 0; i < trail.length; i++) {
                if (trail[i].x === x && trail[i].y === y) return true;
            }
            return false;
        }

        function spawnPowerUp() {
            if (powerUps.length >= POWERUP_MAX) return;
            const types = Object.keys(POWERUP_TYPES);
            const type = types[Math.floor(Math.random() * types.length)];

            let x, y, attempts = 0;
            do {
                x = 3 + Math.floor(Math.random() * (GRID_SIZE - 6));
                y = 3 + Math.floor(Math.random() * (GRID_SIZE - 6));
                attempts++;
            } while (
                attempts < 20 &&
                (trailHasCell(p1.trail, x, y) || trailHasCell(p2.trail, x, y) || powerUps.some(p => p.x === x && p.y === y))
            );

            powerUps.push({ x, y, type, spawnTime: performance.now() });
        }

        function updatePowerUps() {
            const now = performance.now();
            if (now - lastPowerUpSpawn > POWERUP_SPAWN_INTERVAL) {
                spawnPowerUp();
                lastPowerUpSpawn = now;
            }
            powerUps = powerUps.filter(p => now - p.spawnTime < POWERUP_LIFETIME);

            // Tak jak w 3D (PowerUpSystem.update tylko dla `player`) - TYLKO
            // p1 zbiera power-upy, AI (p2) jest na nie obojętne.
            for (let i = powerUps.length - 1; i >= 0; i--) {
                const pu = powerUps[i];
                if (pu.x === p1.x && pu.y === p1.y) {
                    applyPowerUp(p1, p2, pu.type);
                    powerUps.splice(i, 1);
                }
            }
        }

        function applyPowerUp(player, opponent, type) {
            const now = performance.now();
            const config = POWERUP_TYPES[type];
            switch (type) {
                case 'shield':
                    player.shieldUntil = now + config.duration;
                    break;
                case 'speed':
                    player.speedUntil = now + config.duration;
                    break;
                case 'ghost':
                    player.ghostUntil = now + config.duration;
                    break;
                case 'bomb': {
                    // Natychmiastowy efekt - czyści fragment śladu przeciwnika
                    // wokół JEGO bieżącej pozycji (ten sam promień co w 3D -
                    // src/PowerUpSystem.js#destroyTrailSegment).
                    const radius = 5;
                    opponent.trail = opponent.trail.filter(
                        c => Math.hypot(c.x - opponent.x, c.y - opponent.y) >= radius
                    );
                    break;
                }
            }
            powerUpsCollectedThisRound++;
        }

        function updatePowerUpHud() {
            const now = performance.now();
            renderEffectsRow(p1EffectsEl, p1, now);
            renderEffectsRow(p2EffectsEl, p2, now);
        }

        function renderEffectsRow(el, player, now) {
            const chips = [];
            if (player.shieldUntil && now < player.shieldUntil) {
                chips.push(`<span class="effect-chip" style="color:${POWERUP_TYPES.shield.color}">🛡 ${Math.ceil((player.shieldUntil - now) / 1000)}s</span>`);
            }
            if (player.speedUntil && now < player.speedUntil) {
                chips.push(`<span class="effect-chip" style="color:${POWERUP_TYPES.speed.color}">⚡ ${Math.ceil((player.speedUntil - now) / 1000)}s</span>`);
            }
            if (player.ghostUntil && now < player.ghostUntil) {
                chips.push(`<span class="effect-chip" style="color:${POWERUP_TYPES.ghost.color}">👻 ${Math.ceil((player.ghostUntil - now) / 1000)}s</span>`);
            }
            el.innerHTML = chips.join('');
        }

        // === WYBUCH DEREZZ ===
        // Prosty system cząsteczek (canvas, bez zależności) - iskry
        // rozlatujące się promieniście z miejsca kolizji, z tarciem
        // (spowalnianie) i gasnące (życie -> alpha). Aktualizowane w
        // renderLoop() (pełna klatka ekranu, nie stały krok 80ms logiki),
        // żeby ruch był płynny.
        function spawnExplosion(cx, cy, color) {
            const particles = [];
            const count = 26;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2 + Math.random() * 0.3;
                const speed = 70 + Math.random() * 140;
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1
                });
            }
            // Kilka wybuchów naraz (czołówka = dwa, jeden po drugim w tej
            // samej klatce) - dokładamy cząsteczki do wspólnej puli zamiast
            // nadpisywać poprzedni wybuch.
            if (!explosion) explosion = { particles: [] };
            explosion.particles.push(...particles.map(p => ({ ...p, color })));
        }

        function updateExplosion(dt) {
            if (!explosion) return;
            for (const p of explosion.particles) {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vx *= Math.pow(0.05, dt); // tarcie - niezależne od framerate
                p.vy *= Math.pow(0.05, dt);
                p.life -= dt * 1.3;
            }
            explosion.particles = explosion.particles.filter(p => p.life > 0);
            if (explosion.particles.length === 0) explosion = null;
        }

        function drawExplosion() {
            if (!explosion) return;
            for (const p of explosion.particles) {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        // === PĘTLA RENDEROWANIA ===
        // Osobna od logiki gry (setInterval(update, 80), stały krok 80ms) -
        // rysuje co klatkę ekranu (requestAnimationFrame), żeby wybuch i
        // fala świetlna (drawRipple) były płynne niezależnie od tempa
        // symulacji. Działa zawsze (nawet w pauzie/przed startem rundy),
        // żeby idle-screen i dogasający wybuch/potrząśnięcie po końcu
        // rundy nadal się renderowały.
        function renderLoop(now) {
            requestAnimationFrame(renderLoop);
            const dt = Math.min(0.1, (now - lastFrameTime) / 1000); // clamp na wypadek zakładki w tle
            lastFrameTime = now;
            updateExplosion(dt);
            draw();
        }

        function trySetPlayerDirection(player, dx, dy) {
            if (player.dx === -dx && player.dy === -dy) return;
            if (dx !== 0 && player.dx === dx) return;
            if (dy !== 0 && player.dy === dy) return;
            player.dx = dx;
            player.dy = dy;
        }

        // === POPRAWIONE AI - unika kolizji ===
        // Zlicza liczbę pustych pól osiągalnych z danego punktu (BFS) - to
        // daje AI proste "wyczucie przestrzeni": zamiast ruchu czysto losowego,
        // wybiera kierunek, po którym zostaje mu najwięcej miejsca do
        // manewru, więc unika zamykania się w ślepych zaułkach.
        function floodFillCount(startX, startY, blocked) {
            const visited = new Set();
            const startKey = startX + ',' + startY;
            visited.add(startKey);
            const stack = [[startX, startY]];
            let count = 0;
            const MAX_CELLS = GRID_SIZE * GRID_SIZE; // twardy limit bezpieczeństwa

            while (stack.length > 0 && count < MAX_CELLS) {
                const [x, y] = stack.pop();
                count++;

                const neighbors = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
                for (const [nx, ny] of neighbors) {
                    if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) continue;
                    const key = nx + ',' + ny;
                    if (visited.has(key) || blocked.has(key)) continue;
                    visited.add(key);
                    stack.push([nx, ny]);
                }
            }
            return count;
        }

        function aiMove() {
            const directions = [
                { dx: 0, dy: -1 },
                { dx: 0, dy: 1 },
                { dx: -1, dy: 0 },
                { dx: 1, dy: 0 }
            ];

            const blocked = new Set();
            for (const cell of p1.trail) blocked.add(cell.x + ',' + cell.y);
            for (const cell of p2.trail) blocked.add(cell.x + ',' + cell.y);

            // Filtruj bezpieczne kierunki
            const safeMoves = directions.filter(dir => {
                // Nie zawracaj
                if (dir.dx === -p2.dx && dir.dy === -p2.dy) return false;

                const newX = p2.x + dir.dx;
                const newY = p2.y + dir.dy;

                // Sprawdź ściany
                if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                    return false;
                }

                // Sprawdź ślad obu graczy (własny + gracza 1)
                if (blocked.has(newX + ',' + newY)) {
                    return false;
                }

                return true;
            });

            if (safeMoves.length === 0) return; // brak ruchu - nieunikniona śmierć

            // Krok 1: policz dostępną przestrzeń dla każdego bezpiecznego
            // kierunku (samo przetrwanie).
            let bestScore = -1;
            const candidates = safeMoves.map(dir => {
                const nx = p2.x + dir.dx;
                const ny = p2.y + dir.dy;
                const space = floodFillCount(nx, ny, blocked);
                if (space > bestScore) bestScore = space;
                return { dir, nx, ny, space };
            });

            // Krok 2: spośród kierunków "wystarczająco bezpiecznych" (przestrzeń
            // blisko najlepszej - nie musi być idealnie równa) wybierz TEN,
            // który przybliża do PRZEWIDYWANEJ (nie bieżącej) pozycji gracza -
            // czyli kilka pól przed nim, w stronę, w którą jedzie. To wygląda
            // jak realne przechwytywanie/odcinanie drogi, a nie podążanie
            // krok w krok. Wybór jest DETERMINISTYCZNY w większości
            // przypadków (żeby AI wyraźnie i konsekwentnie reagowało na
            // gracza), ale z niewielką (20%) szansą na losowy wybór spośród
            // pozostałych bezpiecznych opcji - tyle wystarczy na odrobinę
            // nieprzewidywalności, bez rozmywania wrażenia, że AI faktycznie
            // "widzi" przeciwnika.
            const SAFETY_MARGIN = Math.max(3, Math.floor(bestScore * 0.15));
            const safeEnough = candidates.filter(c => c.space >= bestScore - SAFETY_MARGIN);

            const PREDICT_AHEAD = 4;
            const predX = Math.max(0, Math.min(GRID_SIZE - 1, p1.x + p1.dx * PREDICT_AHEAD));
            const predY = Math.max(0, Math.min(GRID_SIZE - 1, p1.y + p1.dy * PREDICT_AHEAD));

            let bestDist = Infinity;
            for (const c of safeEnough) {
                const dist = Math.abs(c.nx - predX) + Math.abs(c.ny - predY);
                if (dist < bestDist) bestDist = dist;
            }
            // WAŻNE: zbierz WSZYSTKICH kandydatów z najmniejszym dystansem i
            // wybierz spośród nich losowo, zamiast "pierwszy znaleziony
            // wygrywa". Remisy (np. gdy cel leży po przekątnej - ruch w dół i
            // ruch w prawo skracają dystans identycznie) są bardzo częste, a
            // "pierwszy wygrywa" systematycznie faworyzowało kierunki
            // wcześniejsze w tablicy (góra/dół przed lewo/prawo) - to był
            // realny błąd, przez który AI nie zbiegało poprawnie do celu po
            // przekątnej i sprawiało wrażenie, że nie reaguje na gracza.
            const closest = safeEnough.filter(c => {
                const dist = Math.abs(c.nx - predX) + Math.abs(c.ny - predY);
                return dist === bestDist;
            });
            let best = closest[Math.floor(Math.random() * closest.length)];

            if (safeEnough.length > 1 && Math.random() < 0.2) {
                const alternatives = safeEnough.filter(c => c !== best);
                best = alternatives[Math.floor(Math.random() * alternatives.length)];
            }

            p2.dx = best.dir.dx;
            p2.dy = best.dir.dy;
        }

        // Przycisk Esc / klawisz Escape - wyjście do ekranu wyboru trybu
        // (../index.html). Potwierdzenie tylko wtedy, gdy runda faktycznie
        // trwa - w menu/na overlayu nie ma czego chronić przed przypadkową
        // utratą postępu, więc pytanie tylko by irytowało.
        function exitToMenu() {
            if (isRunning && !isPaused) {
                if (!confirm('Opuścić grę i wrócić do menu?')) return;
            }
            window.location.href = '../index.html';
        }
        document.getElementById('escBtn').addEventListener('click', exitToMenu);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Escape') {
                e.preventDefault();
                exitToMenu();
                return;
            }

            if (e.code === 'Space') {
                e.preventDefault();
                if (!isRunning) startRound();
                else {
                    isPaused = !isPaused;
                    overlay.classList.toggle('hidden', !isPaused);
                    if (isPaused) {
                        overlayTitle.textContent = "PAUZA";
                        startBtn.textContent = "WZNOWIENIE";
                    }
                }
                return;
            }

            if (e.code === 'KeyR') {
                scores = { p1: 0, p2: 0 };
                p1ScoreEl.textContent = '0';
                p2ScoreEl.textContent = '0';
                startRound();
                return;
            }

            if (!isRunning || isPaused) return;

            if (e.code === 'ArrowUp') trySetPlayerDirection(p1, 0, -1);
            if (e.code === 'ArrowDown') trySetPlayerDirection(p1, 0, 1);
            if (e.code === 'ArrowLeft') trySetPlayerDirection(p1, -1, 0);
            if (e.code === 'ArrowRight') trySetPlayerDirection(p1, 1, 0);
        });

        document.querySelectorAll('.dpad-btn').forEach((btn) => {
            const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
            const [dx, dy] = DIRS[btn.dataset.dir];

            const press = (e) => {
                e.preventDefault();
                btn.classList.add('pressed');
                if (isRunning && !isPaused) trySetPlayerDirection(p1, dx, dy);
            };
            const release = (e) => {
                e.preventDefault();
                btn.classList.remove('pressed');
            };

            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('touchcancel', release, { passive: false });
        });

        document.getElementById('fnPause').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isRunning) {
                isPaused = !isPaused;
                overlay.classList.toggle('hidden', !isPaused);
            }
        }, { passive: false });

        document.getElementById('fnRestart').addEventListener('touchstart', (e) => {
            e.preventDefault();
            scores = { p1: 0, p2: 0 };
            p1ScoreEl.textContent = '0';
            p2ScoreEl.textContent = '0';
            startRound();
        }, { passive: false });

        startBtn.addEventListener('click', () => {
            if (!isRunning) startRound();
            else if (isPaused) {
                isPaused = false;
                overlay.classList.add('hidden');
            }
        });

        initGame();
        renderLoop(performance.now());
    </script>
</body>
</html>
