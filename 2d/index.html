<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TRON Light Cycles - Standalone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050811;
            color: #e0f7fc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        header {
            text-align: center;
            width: 100%;
        }

        .title {
            font-size: 2.5rem;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
            margin-bottom: 10px;
            color: #fff;
        }

        .title .highlight {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(10, 20, 40, 0.8);
            padding: 10px 20px;
            border: 1px solid #1a365d;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .p1-score {
            color: #00f3ff;
            text-shadow: 0 0 8px #00f3ff;
        }

        .p2-score {
            color: #ff0055;
            text-shadow: 0 0 8px #ff0055;
        }

        .canvas-wrapper {
            position: relative;
            border: 3px solid #00f3ff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            border-radius: 4px;
            background-color: #000;
            width: min(800px, 92vw, calc(92dvh * 4 / 3));
            aspect-ratio: 4 / 3;
            touch-action: none;
            cursor: pointer;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 17, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 3rem;
            color: #00f3ff;
            text-shadow: 0 0 15px #00f3ff;
            letter-spacing: 2px;
        }

        .overlay p {
            font-size: 1.2rem;
            color: #fff;
        }

        .overlay strong {
            color: #ff0055;
        }

        .controls-info {
            display: flex;
            gap: 25px;
            font-size: 0.9rem;
            background: rgba(10, 20, 40, 0.6);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        .key {
            background: #1a2638;
            border: 1px solid #00f3ff;
            padding: 2px 6px;
            border-radius: 3px;
            color: #00f3ff;
            font-family: monospace;
            box-shadow: 0 0 5px rgba(0, 243, 255, 0.3);
        }

        /* --- Sterowanie dotykowe (tylko na urządzeniach dotykowych) --- */
        .touch-controls {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .touch-controls {
                display: block;
            }
        }

        .dpad {
            position: absolute;
            right: max(20px, env(safe-area-inset-right));
            bottom: max(20px, env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: 56px 56px 56px;
            grid-template-rows: 56px 56px 56px;
            gap: 4px;
            pointer-events: auto;
        }

        .dpad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid rgba(0, 243, 255, 0.5);
            border-radius: 8px;
            color: #00f3ff;
            font-size: 1.4rem;
            touch-action: none;
            user-select: none;
        }

        .dpad-btn:active, .dpad-btn.pressed {
            background: rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 14px rgba(0, 243, 255, 0.7);
        }

        .dpad-up    { grid-column: 2; grid-row: 1; }
        .dpad-left  { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down  { grid-column: 2; grid-row: 3; }

        .fn-controls {
            position: absolute;
            left: max(20px, env(safe-area-inset-left));
            bottom: max(20px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .fn-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 64px;
            height: 48px;
            background: rgba(255, 0, 85, 0.1);
            border: 2px solid rgba(255, 0, 85, 0.5);
            border-radius: 8px;
            color: #ff0055;
            touch-action: none;
            user-select: none;
        }

        .fn-btn .fn-icon {
            font-size: 1.1rem;
            line-height: 1;
        }

        .fn-btn .fn-label {
            font-size: 0.55rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .fn-btn:active, .fn-btn.pressed {
            background: rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 14px rgba(255, 0, 85, 0.7);
        }

        /* --- Komunikat o obrocie ekranu --- */
        .rotate-hint {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(5, 8, 17, 0.95);
            color: #fff;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.3rem;
            gap: 18px;
            padding: 20px;
        }

        .rotate-icon {
            width: 46px;
            height: 74px;
            border: 3px solid #00f3ff;
            border-radius: 8px;
            box-shadow: 0 0 16px rgba(0, 243, 255, 0.6);
            position: relative;
            animation: rotate-phone 1.8s ease-in-out infinite;
        }

        .rotate-icon::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 3px;
            background: #00f3ff;
            border-radius: 2px;
        }

        @keyframes rotate-phone {
            0%, 15%   { transform: rotate(0deg); }
            45%, 65%  { transform: rotate(-90deg); }
            85%, 100% { transform: rotate(-90deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .rotate-icon { animation: none; transform: rotate(-90deg); }
        }

        @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
            .rotate-hint {
                display: flex;
            }
        }

    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <h1 class="title">TRON <span class="highlight">LIGHT CYCLES</span></h1>
            <div class="scoreboard">
                <div class="score p1-score">P1 (CYAN): <span id="p1-score">0</span></div>
                <div class="score p2-score">P2 (MAGENTA): <span id="p2-score">0</span></div>
            </div>
        </header>
        
        <main>
            <div class="canvas-wrapper">
                <canvas id="tronCanvas" width="800" height="600"></canvas>
                <div id="overlay" class="overlay">
                    <h2 id="overlay-title">SYSTEM READY</h2>
                    <p id="overlay-msg">Kliknij przycisk poniżej lub naciśnij <strong>SPACJĘ</strong></p>
                    <button id="start-btn" class="btn-start">URUCHOM CYKL</button>
                </div>
            </div>
        </main>

        <div class="touch-controls" aria-hidden="true">
            <div class="dpad" id="dpad">
                <button type="button" class="dpad-btn dpad-up" data-dir="up">▲</button>
                <button type="button" class="dpad-btn dpad-left" data-dir="left">◀</button>
                <button type="button" class="dpad-btn dpad-right" data-dir="right">▶</button>
                <button type="button" class="dpad-btn dpad-down" data-dir="down">▼</button>
            </div>
            <div class="fn-controls">
                <button type="button" class="fn-btn" id="fnPause"><span class="fn-icon">⏸</span><span class="fn-label">PAUZA</span></button>
                <button type="button" class="fn-btn" id="fnRestart"><span class="fn-icon">↻</span><span class="fn-label">RESTART</span></button>
            </div>
        </div>

        <div class="rotate-hint" id="rotateHint">
            <div class="rotate-icon" aria-hidden="true"></div>
            <p>Obróć telefon, aby zagrać wygodniej</p>
        </div>

        <footer>
            <div class="controls-info">
                <div class="ctrl-group">
                    <strong>Gracz 1 (Cyan):</strong> <span class="key">↑</span> <span class="key">←</span> <span class="key">↓</span> <span class="key">→</span>
                </div>
                <div class="ctrl-group">
                    <strong>Gracz 2 (Magenta):</strong> <span class="key">AI</span> (komputer)
                </div>
                <div class="ctrl-group">
                    <strong>Pauza / Reset:</strong> <span class="key">SPACE</span> / <span class="key">R</span>
                </div>
            </div>
        </footer>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('tronCanvas');
            const ctx = canvas.getContext('2d');

            const overlay = document.getElementById('overlay');
            const overlayTitle = document.getElementById('overlay-title');
            const overlayMsg = document.getElementById('overlay-msg');
            const startBtn = document.getElementById('start-btn');

            const p1ScoreEl = document.getElementById('p1-score');
            const p2ScoreEl = document.getElementById('p2-score');

            const GRID_SIZE = 10;
            const COLS = canvas.width / GRID_SIZE;
            const ROWS = canvas.height / GRID_SIZE;
            const TICK_RATE = 75;

            let grid = [];
            let gameInterval = null;
            let isRunning = false;
            let isPaused = false;
            let scores = { p1: 0, p2: 0 };

            let p1, p2;

            function initPlayers() {
                p1 = { x: 15, y: Math.floor(ROWS / 2), dx: 1, dy: 0, nextDx: 1, nextDy: 0, color: '#00f3ff', glow: 'rgba(0, 243, 255, 0.8)', alive: true };
                p2 = { x: COLS - 16, y: Math.floor(ROWS / 2), dx: -1, dy: 0, nextDx: -1, nextDy: 0, color: '#ff0055', glow: 'rgba(255, 0, 85, 0.8)', alive: true };
            }

            // Wspólna logika skrętu (klawiatura + joystick).
            // Skręt o 90° dozwolony tylko wtedy, gdy gracz nie porusza się już w tej osi
            // (blokuje zawrócenie o 180° na wprost we własny ślad).
            function trySetPlayerDirection(player, dx, dy) {
                if (dx !== 0 && player.dx === 0) {
                    player.nextDx = dx;
                    player.nextDy = 0;
                } else if (dy !== 0 && player.dy === 0) {
                    player.nextDx = 0;
                    player.nextDy = dy;
                }
            }

            // Best-effort blokada orientacji poziomej (dziala np. w Chrome na Androidzie
            // po wejsciu w fullscreen; w Safari na iOS nie jest wspierana - stad rotate-hint w CSS).
            async function tryLockLandscape() {
                try {
                    if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                        await document.documentElement.requestFullscreen();
                    }
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape');
                    }
                } catch (err) {
                    // Niewspierane/zablokowane przez przegladarke - to nie jest błąd krytyczny,
                    // uzytkownik i tak zobaczy komunikat "obróć telefon" jeśli zajdzie taka potrzeba.
                }
            }

            function resetGrid() {
                grid = Array(COLS).fill(null).map(() => Array(ROWS).fill(0));
            }

            function drawGridBackground() {
                ctx.fillStyle = '#02040a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = 'rgba(0, 243, 255, 0.08)';
                ctx.lineWidth = 1;

                for (let x = 0; x <= canvas.width; x += GRID_SIZE * 2) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y <= canvas.height; y += GRID_SIZE * 2) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }
            }

            function startRound() {
                tryLockLandscape();
                resetGrid();
                initPlayers();
                grid[p1.x][p1.y] = 1;
                grid[p2.x][p2.y] = 2;
                drawGridBackground();
                drawPlayer(p1);
                drawPlayer(p2);

                overlay.classList.add('hidden');
                isRunning = true;
                isPaused = false;

                if (gameInterval) clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, TICK_RATE);
            }

            function drawPlayer(player) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = player.glow;
                ctx.fillStyle = player.color;
                ctx.fillRect(player.x * GRID_SIZE + 1, player.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
                ctx.shadowBlur = 0;
            }

            // --- AI przeciwnika (Gracz 2) ---
            function isCellFree(x, y) {
                return x >= 0 && x < COLS && y >= 0 && y < ROWS && grid[x][y] === 0;
            }

            function pathFree(x, y, dx, dy, steps) {
                for (let i = 1; i <= steps; i++) {
                    if (!isCellFree(x + dx * i, y + dy * i)) return false;
                }
                return true;
            }

            function aiDecision(player) {
                const lookAhead = 4;
                const { x, y, dx, dy } = player;

                // Skręt w lewo/prawo względem aktualnego kierunku
                const leftDir = { dx: dy, dy: -dx };
                const rightDir = { dx: -dy, dy: dx };

                const forwardImmediate = pathFree(x, y, dx, dy, 1);
                const leftImmediate = pathFree(x, y, leftDir.dx, leftDir.dy, 1);
                const rightImmediate = pathFree(x, y, rightDir.dx, rightDir.dy, 1);

                // Kolizja tuż przed nosem - trzeba skręcić natychmiast
                if (!forwardImmediate) {
                    const forwardFar = false;
                    const leftFar = pathFree(x, y, leftDir.dx, leftDir.dy, lookAhead);
                    const rightFar = pathFree(x, y, rightDir.dx, rightDir.dy, lookAhead);
                    if (leftFar) return leftDir;
                    if (rightFar) return rightDir;
                    if (leftImmediate) return leftDir;
                    if (rightImmediate) return rightDir;
                    return null; // brak ucieczki
                }

                const forwardFar = pathFree(x, y, dx, dy, lookAhead);
                if (!forwardFar) {
                    const leftFar = pathFree(x, y, leftDir.dx, leftDir.dy, lookAhead);
                    const rightFar = pathFree(x, y, rightDir.dx, rightDir.dy, lookAhead);
                    if (leftFar) return leftDir;
                    if (rightFar) return rightDir;
                    if (leftImmediate) return leftDir;
                    if (rightImmediate) return rightDir;
                    return null;
                }

                // Od czasu do czasu losowy skręt, tylko jeśli bezpieczny
                if (Math.random() < 0.03) {
                    const leftFar = pathFree(x, y, leftDir.dx, leftDir.dy, lookAhead);
                    const rightFar = pathFree(x, y, rightDir.dx, rightDir.dy, lookAhead);
                    if (leftFar && rightFar) return Math.random() < 0.5 ? leftDir : rightDir;
                    if (leftFar) return leftDir;
                    if (rightFar) return rightDir;
                }

                return null; // jedź prosto
            }

            function updatePlayer(player, playerNum) {
                player.dx = player.nextDx;
                player.dy = player.nextDy;
                const nextX = player.x + player.dx;
                const nextY = player.y + player.dy;

                if (nextX < 0 || nextX >= COLS || nextY < 0 || nextY >= ROWS || grid[nextX][nextY] !== 0) {
                    player.alive = false;
                    return;
                }

                player.x = nextX;
                player.y = nextY;
                grid[player.x][player.y] = playerNum;
                drawPlayer(player);
            }

            function gameLoop() {
                if (isPaused) return;

                const aiMove = aiDecision(p2);
                if (aiMove) {
                    p2.nextDx = aiMove.dx;
                    p2.nextDy = aiMove.dy;
                }

                updatePlayer(p1, 1);
                updatePlayer(p2, 2);

                if (p1.x === p2.x && p1.y === p2.y) {
                    p1.alive = false;
                    p2.alive = false;
                }

                if (!p1.alive || !p2.alive) handleGameOver();
            }

            function handleGameOver() {
                clearInterval(gameInterval);
                isRunning = false;
                overlay.classList.remove('hidden');

                if (!p1.alive && !p2.alive) {
                    overlayTitle.textContent = "REMIS!";
                    overlayTitle.style.color = "#ffffff";
                    overlayMsg.innerHTML = "Oba dyski uległy zniszczeniu.";
                } else if (!p1.alive) {
                    scores.p2++;
                    p2ScoreEl.textContent = scores.p2;
                    overlayTitle.textContent = "GRACZ 2 WYGRYWA!";
                    overlayTitle.style.color = "#ff0055";
                    overlayMsg.innerHTML = "Punkt dla gracza różowego!";
                } else if (!p2.alive) {
                    scores.p1++;
                    p1ScoreEl.textContent = scores.p1;
                    overlayTitle.textContent = "GRACZ 1 WYGRYWA!";
                    overlayTitle.style.color = "#00f3ff";
                    overlayMsg.innerHTML = "Punkt dla gracza niebieskiego!";
                }
                startBtn.textContent = "NASTĘPNA RUNDA";
            }

            startBtn.addEventListener('click', () => {
                if (!isRunning) startRound();
            });

            window.addEventListener('keydown', (e) => {
                const key = e.key;
                const code = e.code;

                if (code === 'Space' || key === ' ') {
                    e.preventDefault();
                    if (!isRunning) {
                        startRound();
                    } else {
                        isPaused = !isPaused;
                        overlay.classList.toggle('hidden', !isPaused);
                        if (isPaused) {
                            overlayTitle.textContent = "PAUZA";
                            overlayTitle.style.color = "#00f3ff";
                            overlayMsg.innerHTML = "Gra wstrzymana";
                            startBtn.textContent = "WZNOWIENIE";
                        }
                    }
                    return;
                }

                if (code === 'KeyR' || key.toLowerCase() === 'r') {
                    scores = { p1: 0, p2: 0 };
                    p1ScoreEl.textContent = '0';
                    p2ScoreEl.textContent = '0';
                    startRound();
                    return;
                }

                if (!isRunning || isPaused) return;

                if (code === 'ArrowUp' || code === 'ArrowDown' || code === 'ArrowLeft' || code === 'ArrowRight') {
                    e.preventDefault();
                }

                if ((code === 'ArrowUp' || key === 'ArrowUp')) trySetPlayerDirection(p1, 0, -1);
                if ((code === 'ArrowDown' || key === 'ArrowDown')) trySetPlayerDirection(p1, 0, 1);
                if ((code === 'ArrowLeft' || key === 'ArrowLeft')) trySetPlayerDirection(p1, -1, 0);
                if ((code === 'ArrowRight' || key === 'ArrowRight')) trySetPlayerDirection(p1, 1, 0);
                // Gracz 2 jest sterowany przez AI (patrz aiDecision)
            });

            // --- D-pad dotykowy dla Gracza 1 ---
            (function setupDpad() {
                const buttons = document.querySelectorAll('.dpad-btn');
                const DIRS = {
                    up: [0, -1],
                    down: [0, 1],
                    left: [-1, 0],
                    right: [1, 0]
                };

                buttons.forEach((btn) => {
                    const [dx, dy] = DIRS[btn.dataset.dir];

                    const press = (e) => {
                        e.preventDefault();
                        btn.classList.add('pressed');
                        if (isRunning && !isPaused) trySetPlayerDirection(p1, dx, dy);
                    };
                    const release = (e) => {
                        e.preventDefault();
                        btn.classList.remove('pressed');
                    };

                    btn.addEventListener('touchstart', press, { passive: false });
                    btn.addEventListener('touchend', release, { passive: false });
                    btn.addEventListener('touchcancel', release, { passive: false });
                    // click jako fallback (np. test na desktopie/DevTools) - touchstart
                    // i tak obsłuży prawdziwy dotyk pierwszy, click się nie zdubluje
                    // dzięki temu, że press() jest idempotentny (trySetPlayerDirection
                    // nie ma efektów ubocznych przy powtórnym wywołaniu tego samego kierunku).
                    btn.addEventListener('click', press);
                });
            })();

            // --- Przyciski funkcyjne (pauza / restart) ---
            document.getElementById('fnPause').addEventListener('click', () => {
                if (!isRunning) return;
                isPaused = !isPaused;
                overlay.classList.toggle('hidden', !isPaused);
                if (isPaused) {
                    overlayTitle.textContent = "PAUZA";
                    overlayTitle.style.color = "#00f3ff";
                    overlayMsg.innerHTML = "Gra wstrzymana";
                    startBtn.textContent = "WZNOWIENIE";
                }
            });

            document.getElementById('fnRestart').addEventListener('click', () => {
                scores = { p1: 0, p2: 0 };
                p1ScoreEl.textContent = '0';
                p2ScoreEl.textContent = '0';
                startRound();
            });

            drawGridBackground();
        });
    </script>
</body>
</html>
