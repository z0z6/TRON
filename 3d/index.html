<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TRON Light Cycles 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000011; }
        canvas { display: block; width: 100%; height: 100%; }

        #hud {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 10;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            color: #aef1ff;
            background: rgba(0, 10, 20, 0.55);
            border: 1px solid rgba(0, 243, 255, 0.35);
            border-radius: 6px;
            padding: 10px 14px;
            line-height: 1.6;
            pointer-events: none;
            text-shadow: 0 0 6px rgba(0, 243, 255, 0.5);
        }

        #hud .key {
            display: inline-block;
            background: #10222c;
            border: 1px solid #00f3ff;
            border-radius: 3px;
            padding: 0 5px;
            margin-right: 3px;
            font-family: monospace;
        }

        @media (hover: none) and (pointer: coarse) {
            #hud { display: none; }
        }

        #scoreHud {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #aef1ff;
            text-align: right;
            pointer-events: none;
            text-shadow: 0 0 6px rgba(0, 243, 255, 0.5);
        }

        #scoreHud .score {
            font-size: 28px;
            font-weight: bold;
        }

        #scoreHud .combo {
            font-size: 15px;
            color: #ffcc00;
            text-shadow: 0 0 6px rgba(255, 204, 0, 0.6);
            min-height: 20px;
        }

        #effectsHud {
            position: fixed;
            top: 90px;
            right: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-end;
        }

        #effectsHud .effect {
            font-family: monospace;
            font-size: 12px;
            color: #0f0;
            background: rgba(0, 20, 10, 0.6);
            border: 1px solid rgba(0, 255, 0, 0.4);
            border-radius: 4px;
            padding: 2px 8px;
        }

        #toastHud {
            position: fixed;
            top: 160px;
            right: 16px;
            z-index: 10;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #ffee00;
            text-shadow: 0 0 8px rgba(255, 238, 0, 0.7);
            pointer-events: none;
            text-align: right;
            transition: opacity 0.15s linear;
        }

        #achievementToast {
            position: fixed;
            top: 24px;
            left: 50%;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, rgba(20, 10, 0, 0.92), rgba(40, 25, 0, 0.92));
            border: 1px solid rgba(255, 200, 0, 0.6);
            border-radius: 8px;
            padding: 10px 18px;
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.35);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffe9b0;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -16px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        #achievementToast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        #achievementToast .icon {
            font-size: 26px;
        }

        #achievementToast .name {
            font-weight: bold;
            font-size: 14px;
            color: #ffd24a;
        }

        #achievementToast .desc {
            font-size: 12px;
            color: #d8c79a;
        }

        /* === STARTUP ROTATE MESSAGE === */
        .startup-rotate-message {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(5, 8, 17, 0.98);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 40px 20px;
            text-align: center;
        }

        .startup-rotate-message.active {
            display: flex;
        }

        .rotate-animation {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-icon {
            position: absolute;
            width: 80px;
            height: 140px;
            border: 4px solid #00f3ff;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6), inset 0 0 20px rgba(0, 243, 255, 0.2);
            background: rgba(0, 243, 255, 0.1);
        }

        .phone-icon::after {
            content: '';
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: #00f3ff;
            border-radius: 2px;
        }

        .phone-icon.portrait {
            animation: phoneRotateOut 1.5s ease-in-out forwards;
        }

        .phone-icon.landscape {
            transform: rotate(-90deg);
            border-color: #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6), inset 0 0 20px rgba(255, 0, 85, 0.2);
            background: rgba(255, 0, 85, 0.1);
            opacity: 0;
            animation: phoneRotateIn 1.5s ease-in-out forwards;
        }

        .phone-icon.landscape::after {
            background: #ff0055;
        }

        .arrow-rotate {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid transparent;
            border-top-color: #ff0055;
            border-right-color: #ff0055;
            border-radius: 50%;
            opacity: 0;
            animation: arrowSpin 1.5s ease-in-out forwards;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
        }

        @keyframes phoneRotateOut {
            0%, 30% { opacity: 1; transform: rotate(0deg) scale(1); }
            70%, 100% { opacity: 0; transform: rotate(-90deg) scale(0.8); }
        }

        @keyframes phoneRotateIn {
            0%, 30% { opacity: 0; transform: rotate(-90deg) scale(0.8); }
            70%, 100% { opacity: 1; transform: rotate(-90deg) scale(1); }
        }

        @keyframes arrowSpin {
            0%, 10% { opacity: 0; transform: rotate(0deg) scale(0.5); }
            50%, 60% { opacity: 1; transform: rotate(-180deg) scale(1); }
            90%, 100% { opacity: 0; transform: rotate(-360deg) scale(0.5); }
        }

        .glitch-text {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #00f3ff;
            letter-spacing: 8px;
            position: relative;
            animation: glitch 1.5s ease-in-out;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch-text::before {
            color: #00f3ff;
            animation: glitch-1 0.3s ease-in-out;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }

        .glitch-text::after {
            color: #ff0055;
            animation: glitch-2 0.3s ease-in-out;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        }

        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }

        @keyframes glitch-1 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(3px, 0); }
            40% { transform: translate(-3px, 0); }
        }

        @keyframes glitch-2 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-3px, 0); }
            40% { transform: translate(3px, 0); }
        }

        .instruction-text {
            font-size: clamp(1rem, 3vw, 1.2rem);
            color: #e0f7fc;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
            max-width: 400px;
            line-height: 1.6;
            animation: fadeIn 1.5s ease-in-out;
        }

        .loading-bar {
            width: min(300px, 80vw);
            height: 4px;
            background: rgba(0, 243, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #00f3ff, #ff0055);
            box-shadow: 0 0 15px #00f3ff;
            animation: loadingProgress 1.5s ease-out forwards;
            width: 0;
        }

        @keyframes loadingProgress {
            0% { width: 0; }
            100% { width: 100%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === TOUCH CONTROLS === */
        .touch-controls {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .touch-controls { display: block; }
        }

        .turn-pad {
            position: absolute;
            right: max(20px, env(safe-area-inset-right, 20px));
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .turn-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(70px, 10vw);
            height: min(70px, 10vw);
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid rgba(0, 243, 255, 0.5);
            border-radius: 12px;
            color: #00f3ff;
            font-size: 1.8rem;
            touch-action: none;
            user-select: none;
            transition: all 0.1s ease;
        }

        .turn-btn:active, .turn-btn.pressed {
            background: rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 14px rgba(0, 243, 255, 0.7);
        }

        .fn-controls-3d {
            position: absolute;
            left: max(20px, env(safe-area-inset-left, 20px));
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }

        .fn-btn-3d {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            width: min(65px, 9vw);
            height: min(48px, 6.5vw);
            background: rgba(255, 0, 255, 0.1);
            border: 2px solid rgba(255, 0, 255, 0.5);
            border-radius: 8px;
            color: #ff77ff;
            touch-action: none;
            user-select: none;
            transition: all 0.1s ease;
        }

        .fn-btn-3d:active, .fn-btn-3d.pressed {
            background: rgba(255, 0, 255, 0.4);
            box-shadow: 0 0 14px rgba(255, 0, 255, 0.6);
        }

        .fn-btn-3d .fn-icon-3d { font-size: 1rem; line-height: 1; }
        .fn-btn-3d .fn-label-3d { font-size: 0.5rem; font-weight: bold; letter-spacing: 0.5px; line-height: 1; }

        .touch-start-btn {
            display: none;
            position: fixed;
            left: 50%;
            bottom: max(100px, env(safe-area-inset-bottom, 100px));
            transform: translateX(-50%);
            z-index: 25;
            padding: clamp(10px, 3vw, 14px) clamp(24px, 6vw, 32px);
            background: rgba(0, 243, 255, 0.15);
            border: 2px solid #00f3ff;
            border-radius: 30px;
            color: #00f3ff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: bold;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            touch-action: none;
            user-select: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .touch-start-btn { display: block; }
        }

        /* === FORCE LANDSCAPE === */
        .force-landscape canvas {
            position: fixed;
            width: 100vh;
            height: 100vw;
            top: 50%;
            left: 50%;
            transform: rotate(90deg);
            transform-origin: center center;
        }

        .force-landscape #scoreHud,
        .force-landscape #effectsHud,
        .force-landscape #toastHud,
        .force-landscape #hud {
            transform: rotate(-90deg);
            transform-origin: center center;
        }

        .force-landscape #scoreHud {
            top: 50%;
            right: calc(50% - 200px);
            transform: rotate(-90deg) translate(-200px, -200px);
        }

        .force-landscape .touch-controls {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .force-landscape .turn-pad {
            right: max(20px, env(safe-area-inset-right, 20px));
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
        }

        .force-landscape .fn-controls-3d {
            left: max(20px, env(safe-area-inset-left, 20px));
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
        }

        .force-landscape .touch-start-btn {
            bottom: max(100px, env(safe-area-inset-bottom, 100px));
        }
    </style>
  <script type="module" crossorigin src="/TRON/3d/assets/index-Cl0pjRZJ.js"></script>

<body>
    <!-- STARTUP ROTATE MESSAGE -->
    <div class="startup-rotate-message" id="startupRotateMessage">
        <div class="rotate-animation">
            <div class="phone-icon portrait"></div>
            <div class="arrow-rotate"></div>
            <div class="phone-icon landscape"></div>
        </div>
        <h2 class="glitch-text" data-text="OBRÓĆ URZĄDZENIE">OBRÓĆ URZĄDZENIE</h2>
        <p class="instruction-text">Aby kontynuować, obróć telefon do poziomu</p>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <div id="scoreHud">
        <div class="score" id="scoreValue">0</div>
        <div class="combo" id="comboValue"></div>
    </div>
    <div id="effectsHud"></div>
    <div id="toastHud"></div>
    <div id="achievementToast">
        <span class="icon" id="achievementIcon"></span>
        <div>
            <div class="name" id="achievementName"></div>
            <div class="desc" id="achievementDesc"></div>
        </div>
    </div>
    <div id="hud">
        <div><span class="key">SPACE</span>start / <span class="key">R</span>restart</div>
        <div><span class="key">←</span><span class="key">→</span> / <span class="key">A</span><span class="key">D</span> skręt</div>
        <div><span class="key">C</span>kamera <span class="key">M</span>wycisz <span class="key">L</span>multiplayer</div>
    </div>

    <div class="touch-controls" aria-hidden="true">
        <div class="turn-pad" id="turnPad">
            <button type="button" class="turn-btn" data-turn="left">◀</button>
            <button type="button" class="turn-btn" data-turn="right">▶</button>
        </div>
        <div class="fn-controls-3d">
            <button type="button" class="fn-btn-3d" id="fnRestart3d"><span class="fn-icon-3d">↻</span><span class="fn-label-3d">RESTART</span></button>
            <button type="button" class="fn-btn-3d" id="fnCamera3d"><span class="fn-icon-3d">🎥</span><span class="fn-label-3d">KAMERA</span></button>
            <button type="button" class="fn-btn-3d" id="fnMute3d"><span class="fn-icon-3d">🔇</span><span class="fn-label-3d">WYCISZ</span></button>
            <button type="button" class="fn-btn-3d" id="fnLobby3d"><span class="fn-icon-3d">🌐</span><span class="fn-label-3d">SIEĆ</span></button>
        </div>
    </div>

    <button type="button" class="touch-start-btn" id="touchStartBtn">URUCHOM CYKL</button>

    <script>
        // === STARTUP ROTATE MESSAGE LOGIC - 3D VERSION ===
        (function setupStartupRotateMessage3D() {
            const messageEl = document.getElementById('startupRotateMessage');
            const DISPLAY_DURATION = 1500;
            
            const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
            
            if (!isTouchDevice) {
                if (messageEl) messageEl.style.display = 'none';
                return;
            }
            
            function showRotateMessage() {
                if (!messageEl) return;
                messageEl.classList.add('active');
                
                setTimeout(() => {
                    messageEl.classList.remove('active');
                    setTimeout(() => {
                        messageEl.style.display = 'none';
                        forceLandscapeOrientation();
                    }, 300);
                }, DISPLAY_DURATION);
            }
            
            function forceLandscapeOrientation() {
                document.body.classList.add('force-landscape');
                sessionStorage.setItem('tron3dLandscapeForced', 'true');
            }
            
            const alreadyForced = sessionStorage.getItem('tron3dLandscapeForced') === 'true';
            
            if (!alreadyForced) {
                showRotateMessage();
            } else {
                if (messageEl) messageEl.style.display = 'none';
                forceLandscapeOrientation();
            }
        })();
    </script>
</body>
