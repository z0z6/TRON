<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TRON Light Cycles 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* === MOTYW KOLORYSTYCZNY ===
               Domyślne wartości = TRON CLASSIC (dokładnie to, co było na
               sztywno wcześniej). JS (theme-picker) nadpisuje je przy
               starcie/zmianie motywu. R/G/B osobno - potrzebne przez rgba(). */
            --theme-p1: var(--theme-p1);
            --theme-p1-r: 0;
            --theme-p1-g: 243;
            --theme-p1-b: 255;
            --theme-p2: var(--theme-p2);
            --theme-p2-r: 255;
            --theme-p2-g: 0;
            --theme-p2-b: 85;
            --theme-bg: #000011;

            /* Rzeczywisty, POPRAWNIE zorientowany rozmiar pola gry - aktualizowany
               z JS, żeby proporcjonalne elementy (turn-pad, klawisze funkcyjne)
               skalowały się względem prawdziwej wysokości/szerokości ekranu w
               trybie poziomym zamiast surowych vw/vh, które ignorują transform. */
            --vp-w: 100vw;
            --vp-h: 100vh;

            /* Wspólny "komponent" D-Pada i klawiszy funkcyjnych - te same
               wartości co w wersji 2D, żeby sterowanie wyglądało identycznie
               wszędzie. Marginesy po bokach pola gry są liczone NIEZALEŻNIE
               dla każdej strony (względem rozmiaru elementu, który tam stoi),
               więc D-Pad może być większy niż klawisze funkcyjne bez
               marnowania miejsca po stronie, gdzie stoi coś mniejszego. */
            /* Przyciski skrętu (lewo/prawo) - w 3D funkcjonalnie używane są
               TYLKO te dwa (bez cofania/przyspieszania jak w 2D), więc mają
               własny, niezależny rozmiar zamiast dziedziczyć po starym
               układzie 3x3 (--dpad-size), gdzie realny przycisk to było
               tylko 1/3 tamtej siatki. Wysokość: 2x względem starego
               rozmiaru przycisku (dpad-size/3). Szerokość: 1.1x względem
               starego rozmiaru. */
            --dpad-size: clamp(120px, calc(var(--vp-h) * 0.38), 165px);
            --turn-btn-h: calc(var(--dpad-size) / 3 * 2);
            --turn-btn-w: calc(var(--dpad-size) / 3 * 1.1);
            /* Margines prawy zmniejszony o 25% względem poprzedniej wartości
               (dpad-size + 3px) - odzyskana przestrzeń oddana polu gry przez
               #gameCanvasWrap (patrz jego inset niżej), które już liczy się
               względem tej samej zmiennej. */
            --side-margin-right: calc((var(--dpad-size) + 3px) * 0.75);
            /* Klawisze funkcyjne - 75% poprzedniego rozmiaru (mniejsze), co
               automatycznie zwęża lewy margines i oddaje tę przestrzeń polu
               gry. */
            --fn-btn-w: clamp(44px, calc(var(--vp-h) * 0.11), 56px);
            --fn-btn-h: clamp(32px, calc(var(--vp-h) * 0.079), 41px);
            --side-margin-left: calc(var(--fn-btn-w) + 6px);
        }

        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--theme-bg); }

        /* Scena 3D renderuje się do #gameCanvasWrap (nie bezpośrednio do body).
           Marginesy na sterowanie dotykowe (--side-margin) zwężają to pole
           TYLKO tam, gdzie D-Pad/klawisze funkcyjne faktycznie się pokazują -
           na desktopie z myszką canvas zostaje pełnoekranowy. */
        #gameCanvasWrap {
            position: fixed;
            inset: 0;
        }

        @media (hover: none) and (pointer: coarse) {
            #gameCanvasWrap {
                inset: 0 var(--side-margin-right) 0 var(--side-margin-left);
            }
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* === WYMUSZONA ORIENTACJA POZIOMA (Android/mobile) ===
           Obraca całą stronę o 90° przez CSS, niezależnie od systemowego
           ustawienia auto-rotacji Androida. Canvas Three.js jest dzieckiem
           body i jest ustawiany na SPRZĘŻONE (zamienione) wymiary przez
           renderer.setSize - patrz window.__getRenderSize w skrypcie poniżej. */
        html.force-landscape body {
            position: fixed;
            top: 50%;
            left: 50%;
            min-height: 0;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
            overflow: hidden;
        }

        #scoreHud {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--theme-p1);
            text-align: right;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.6);
        }

        #scoreHud .score { font-size: 32px; font-weight: bold; }
        #scoreHud .combo {
            font-size: 16px;
            color: #ffcc00;
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.7);
            min-height: 20px;
        }

        #effectsHud {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        #effectsHud .effect {
            font-family: monospace;
            font-size: 13px;
            color: #0f0;
            background: rgba(0, 20, 10, 0.7);
            border: 1px solid rgba(0, 255, 0, 0.5);
            border-radius: 4px;
            padding: 3px 10px;
        }

        #toastHud {
            position: fixed;
            top: 180px;
            right: 20px;
            z-index: 10;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;
            color: #ffee00;
            text-shadow: 0 0 10px rgba(255, 238, 0, 0.8);
            pointer-events: none;
            text-align: right;
            transition: opacity 0.15s linear;
        }

        #achievementToast {
            position: fixed;
            top: 30px;
            left: 50%;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, rgba(20, 10, 0, 0.95), rgba(40, 25, 0, 0.95));
            border: 1px solid rgba(255, 200, 0, 0.7);
            border-radius: 8px;
            padding: 12px 20px;
            box-shadow: 0 0 25px rgba(255, 200, 0, 0.4);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffe9b0;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -16px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        #achievementToast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        #achievementToast .icon { font-size: 28px; }
        #achievementToast .name { font-weight: bold; font-size: 15px; color: #ffd24a; }
        #achievementToast .desc { font-size: 13px; color: #d8c79a; }

        /* === EKRAN PODSUMOWANIA RUNDY (wynik, statystyki, osiągnięcia,
           rekordy) - pokazywany przez showGameOverOverlay() w main.js po
           każdej zakończonej rundzie. === */
        #gameOverOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            align-items: center;
            justify-content: center;
            background: rgba(3, 5, 12, 0.82);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e0f7fc;
            padding: 16px;
        }

        #gameOverOverlay.show { display: flex; }

        #gameOverOverlay .panel {
            width: min(420px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: linear-gradient(160deg, rgba(10, 14, 28, 0.97), rgba(6, 8, 18, 0.97));
            border: 1px solid rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.5);
            border-radius: 14px;
            padding: 22px 24px;
            box-shadow: 0 0 40px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.25);
            text-align: center;
        }

        #gameOverOverlay h2 {
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            letter-spacing: 3px;
            margin-bottom: 4px;
        }

        #gameOverOverlay h2.won { color: var(--theme-p1); text-shadow: 0 0 20px var(--theme-p1); }
        #gameOverOverlay h2.lost { color: var(--theme-p2); text-shadow: 0 0 20px var(--theme-p2); }

        #gameOverOverlay .final-score {
            font-size: clamp(2.2rem, 9vw, 3rem);
            font-weight: bold;
            margin: 6px 0 2px;
        }

        #gameOverOverlay .record-badge {
            display: none;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffd24a;
            text-shadow: 0 0 10px rgba(255, 210, 74, 0.8);
            margin-bottom: 10px;
        }

        #gameOverOverlay .record-badge.show { display: block; }

        #gameOverOverlay .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
            margin: 14px 0;
            font-size: 0.85rem;
            text-align: left;
        }

        #gameOverOverlay .stats-grid .label { color: #8fa; opacity: 0.65; }
        #gameOverOverlay .stats-grid .value { font-weight: bold; text-align: right; }

        #gameOverOverlay .achievements-new {
            margin: 12px 0;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        #gameOverOverlay .achievements-new .row {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            padding: 6px 0;
        }

        #gameOverOverlay .achievements-new .row .icon { font-size: 22px; }
        #gameOverOverlay .achievements-new .row .name { font-weight: bold; font-size: 0.85rem; color: #ffd24a; }
        #gameOverOverlay .achievements-new .row .desc { font-size: 0.72rem; color: #d8c79a; }

        #gameOverOverlay .lifetime {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 0.72rem;
            color: rgba(224, 247, 252, 0.6);
        }

        #gameOverOverlay .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        #gameOverOverlay button {
            padding: 10px 22px;
            border-radius: 30px;
            border: 2px solid var(--theme-p1);
            background: rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.15);
            color: var(--theme-p1);
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 0.85rem;
            cursor: pointer;
            touch-action: manipulation;
        }

        #gameOverOverlay .countdown {
            margin-top: 10px;
            font-size: 0.68rem;
            color: rgba(224, 247, 252, 0.45);
        }

        /* === PRZEŁĄCZNIK MOTYWU KOLORYSTYCZNEGO === */
        .theme-picker {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 40;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(5, 8, 17, 0.7);
            border: 2px solid var(--theme-p1);
            color: var(--theme-p1);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px currentColor;
            cursor: pointer;
            touch-action: manipulation;
        }

        .theme-menu {
            display: none;
            flex-direction: column;
            gap: 4px;
            position: absolute;
            top: 48px;
            left: 0;
            background: rgba(5, 8, 17, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 8px;
            min-width: 170px;
        }

        .theme-menu.open { display: flex; }

        /* === PRZYCISK WYJŚCIA (Esc) - celowo stonowany (szary, bez
           kolorowej poświaty), żeby nie konkurował wizualnie z przełącznikiem
           motywu obok, mimo że stoi w tym samym rogu ekranu. Ten sam
           komponent co w wersji 2D (2d/index.html), patrz komentarz tam. === */
        .esc-btn {
            position: fixed;
            top: 16px;
            left: 64px;
            z-index: 40;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(5, 8, 17, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: rgba(224, 247, 252, 0.7);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.15s ease;
        }

        .esc-btn:hover, .esc-btn:active {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.5);
            color: #fff;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: #e0f7fc;
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            touch-action: manipulation;
        }

        .theme-option:hover, .theme-option:active {
            background: rgba(255, 255, 255, 0.08);
        }

        .theme-option.active {
            outline: 1px solid rgba(255, 255, 255, 0.35);
        }

        .theme-swatch {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }

        /* === KOMUNIKAT O OBROCIE EKRANU === */
        .rotate-message {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, rgba(12, 6, 26, 0.97) 0%, rgba(2, 2, 8, 0.99) 100%);
            opacity: 1;
            transition: opacity 0.32s ease;
        }

        .rotate-message.hide { opacity: 0; }

        @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
            .rotate-message { display: flex; }
        }

        .rotate-message-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            padding: 0 32px;
        }

        .rotate-icon {
            width: 40px;
            height: 68px;
            border: 3px solid var(--theme-p1);
            border-radius: 9px;
            position: relative;
            background: rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.06);
            box-shadow: 0 0 16px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.65), 0 0 30px rgba(var(--theme-p2-r), var(--theme-p2-g), var(--theme-p2-b), 0.25), inset 0 0 10px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.25);
            animation: rotate-phone-hint 1.6s ease-in-out infinite;
        }

        .rotate-icon::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 7px;
            transform: translateX(-50%);
            width: 12px;
            height: 3px;
            border-radius: 2px;
            background: var(--theme-p1);
            box-shadow: 0 0 6px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.8);
        }

        @keyframes rotate-phone-hint {
            0%, 12%  { transform: rotate(0deg); }
            45%, 70% { transform: rotate(-90deg); }
            100%     { transform: rotate(-90deg); }
        }

        .rotate-text {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: clamp(0.95rem, 4vw, 1.15rem);
            font-weight: bold;
            letter-spacing: 2.5px;
            text-align: center;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--theme-p1), var(--theme-p2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 8px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.45)) drop-shadow(0 0 8px rgba(var(--theme-p2-r), var(--theme-p2-g), var(--theme-p2-b), 0.45));
            animation: rotate-text-pulse 1.6s ease-in-out infinite;
        }

        @keyframes rotate-text-pulse {
            0%, 100% { opacity: 0.75; }
            50%      { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .rotate-icon, .rotate-text { animation: none; }
            .rotate-icon { transform: rotate(-90deg); }
        }

        /* === TOUCH CONTROLS === */
        .touch-controls {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .touch-controls { display: block; }
        }

        /* Strefy sterowania - dedykowane, NIEWIELKIE marginesy po bokach pola
           gry (patrz --side-margin, powiązane z rozmiarem D-Pada). Pole gry
           (#gameCanvasWrap) jest odpowiednio zwężone przez ten sam --side-margin,
           więc motocykl nigdy nie jeździ "pod" przyciskami - to czytelnie
           oddzielone od rozgrywki strefy, nie nakładka na canvas. */
        .control-zone {
            position: fixed;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .control-zone-right { right: 0; width: var(--side-margin-right); }
        .control-zone-left { left: 0; width: var(--side-margin-left); }

        /* D-Pad - komponent WSPÓLNY z wersją 2D (identyczny rozmiar i styl,
           patrz --dpad-size). W 3D dostępny funkcjonalnie jest tylko skręt
           lewo/prawo (bez cofania/przyspieszania) - górna/dolna komórka
           siatki zostaje pusta, ale sam D-Pad (rozmiar, wygląd, pozycja w
           prawej strefie) jest identyczny jak w 2D. */
        /* Przyciski skrętu - lewo/prawo, obok siebie. W 3D (w przeciwieństwie
           do 2D) dostępny funkcjonalnie jest tylko skręt, więc to prosty
           rząd flex zamiast siatki 3x3 - każdy przycisk ma teraz WŁASNY,
           większy rozmiar (patrz --turn-btn-w/--turn-btn-h w :root), a nie
           1/3 wspólnego kontenera jak wcześniej. */
        .dpad {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: var(--side-margin-right);
            pointer-events: auto;
        }

        .dpad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: var(--turn-btn-w);
            height: var(--turn-btn-h);
            flex-shrink: 0;
            background: rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.15);
            border: 2px solid rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.6);
            border-radius: 10px;
            color: var(--theme-p1);
            font-size: clamp(1.5rem, 4.5vw, 2.1rem);
            touch-action: none;
            user-select: none;
            transition: all 0.1s ease;
        }

        .dpad-btn:active, .dpad-btn.pressed {
            background: rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.5);
            box-shadow: 0 0 20px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.8);
        }

        /* Klawisze funkcyjne - komponent WSPÓLNY z wersją 2D, w lewej strefie. */
        .fn-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }

        .fn-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: var(--fn-btn-w);
            height: var(--fn-btn-h);
            background: rgba(var(--theme-p2-r), var(--theme-p2-g), var(--theme-p2-b), 0.15);
            border: 2px solid rgba(var(--theme-p2-r), var(--theme-p2-g), var(--theme-p2-b), 0.6);
            border-radius: 10px;
            color: #ff77ff;
            touch-action: none;
            user-select: none;
            transition: all 0.1s ease;
        }

        .fn-btn:active, .fn-btn.pressed {
            background: rgba(var(--theme-p2-r), var(--theme-p2-g), var(--theme-p2-b), 0.5);
            box-shadow: 0 0 20px rgba(var(--theme-p2-r), var(--theme-p2-g), var(--theme-p2-b), 0.8);
        }

        .fn-btn .fn-icon { font-size: 0.9rem; }
        .fn-btn .fn-label { font-size: 0.45rem; font-weight: bold; letter-spacing: 0.4px; }

        .touch-start-btn {
            display: none;
            position: fixed;
            left: 50%;
            bottom: max(120px, env(safe-area-inset-bottom, 120px));
            transform: translateX(-50%);
            z-index: 25;
            padding: clamp(14px, 4vw, 18px) clamp(36px, 10vw, 50px);
            background: rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.15);
            border: 3px solid var(--theme-p1);
            border-radius: 40px;
            color: var(--theme-p1);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: bold;
            font-size: clamp(1rem, 3vw, 1.2rem);
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(var(--theme-p1-r), var(--theme-p1-g), var(--theme-p1-b), 0.5);
            touch-action: none;
            user-select: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .touch-start-btn { display: block; }
        }

        /* === BANER BŁĘDU - pokazuje treść nieobsłużonego wyjątku JS wprost
           na ekranie, żeby dało się go odczytać/zrobić zrzut ekranu bez

    <div id="errorBanner"></div>

    <script>
        // === MOTYW KOLORYSTYCZNY ===
        // Musi wystartować jak najwcześniej (klasyczny, nie modułowy skrypt -
        // wykonuje się przed odroczonym modułem Three.js poniżej, patrz
        // analogiczny komentarz przy orientation-lock).
        (function () {
            const THEMES = {
                classic:   { name: 'TRON CLASSIC', p1: '#00f3ff', p2: '#ff0055', bg: '#0c0420' },
                synthwave: { name: 'SYNTHWAVE',    p1: '#ff2f9e', p2: '#ffd23f', bg: '#0c0420' },
                matrix:    { name: 'MATRIX',       p1: '#39ff14', p2: '#0d7a3f', bg: '#000f05' },
                amber:     { name: 'AMBER',        p1: '#ff8c00', p2: '#ff2e2e', bg: '#1a0800' },
                glacier:   { name: 'GLACIER',      p1: '#4fd8ff', p2: '#ffffff', bg: '#001522' }
            };

            function hexToRgb(hex) {
                const h = hex.replace('#', '');
                return {
                    r: parseInt(h.substring(0, 2), 16),
                    g: parseInt(h.substring(2, 4), 16),
                    b: parseInt(h.substring(4, 6), 16)
                };
            }

            function hexToRgba(hex, alpha) {
                const c = hexToRgb(hex);
                return `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`;
            }
            window.__tronHexToRgba = hexToRgba;
            window.__TRON_THEMES = THEMES;

            function applyTheme(key) {
                const theme = THEMES[key] || THEMES.classic;
                const root = document.documentElement;
                const p1 = hexToRgb(theme.p1);
                const p2 = hexToRgb(theme.p2);

                root.style.setProperty('--theme-p1', theme.p1);
                root.style.setProperty('--theme-p1-r', p1.r);
                root.style.setProperty('--theme-p1-g', p1.g);
                root.style.setProperty('--theme-p1-b', p1.b);
                root.style.setProperty('--theme-p2', theme.p2);
                root.style.setProperty('--theme-p2-r', p2.r);
                root.style.setProperty('--theme-p2-g', p2.g);
                root.style.setProperty('--theme-p2-b', p2.b);
                root.style.setProperty('--theme-bg', theme.bg);

                document.querySelectorAll('.theme-option').forEach((btn) => {
                    btn.classList.toggle('active', btn.dataset.theme === key);
                });

                window.__tronTheme = theme;
                window.__tronThemeKey = key;
                try { localStorage.setItem('tron-theme', key); } catch (e) {}
                window.dispatchEvent(new CustomEvent('tron-theme-change', { detail: theme }));
            }
            window.__applyTronTheme = applyTheme;

            let savedKey = 'classic';
            try { savedKey = localStorage.getItem('tron-theme') || 'classic'; } catch (e) {}
            if (!THEMES[savedKey]) savedKey = 'classic';
            applyTheme(savedKey);

            document.addEventListener('DOMContentLoaded', function () {
                const toggle = document.getElementById('themeToggle');
                const menu = document.getElementById('themeMenu');
                if (!toggle || !menu) return;

                toggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    menu.classList.toggle('open');
                });
                menu.querySelectorAll('.theme-option').forEach((btn) => {
                    btn.addEventListener('click', function () {
                        applyTheme(btn.dataset.theme);
                        menu.classList.remove('open');
                    });
                });
                document.addEventListener('click', function () {
                    menu.classList.remove('open');
                });

                document.querySelectorAll('.theme-option').forEach((btn) => {
                    btn.classList.toggle('active', btn.dataset.theme === window.__tronThemeKey);
                });
            });
        })();
    </script>

    <script>
        // === WYMUSZENIE ORIENTACJI POZIOMEJ ===
        // Klasyczny (nie module) skrypt - wykonuje się natychmiast, PRZED
        // odroczonym skryptem modułowym z Three.js poniżej, więc
        // window.__getRenderSize jest już dostępne, gdy main.js tworzy
        // kamerę/renderer. Bezwarunkowo wymusza landscape po ukryciu
        // komunikatu, niezależnie od systemowego ustawienia auto-rotacji.
        (function () {
            function isTouchDevice() {
                return window.matchMedia('(hover: none) and (pointer: coarse)').matches;
            }

            function computeSize() {
                var w = window.innerWidth, h = window.innerHeight;
                var portrait = h > w;
                var forced = isTouchDevice() && portrait;
                return { forced: forced, width: forced ? h : w, height: forced ? w : h };
            }

            window.__getRenderSize = computeSize;

            // Rozmiar POLA GRY (po odjęciu marginesów --side-margin z obu
            // stron) - mierzony bezpośrednio z DOM-u (#gameCanvasWrap), więc
            // zawsze zgodny z tym, co faktycznie liczy CSS (jedno źródło
            // prawdy zamiast duplikowania wzoru na margines w JS).
            window.__getFieldSize = function () {
                var el = document.getElementById('gameCanvasWrap');
                if (el) {
                    var w = el.clientWidth, h = el.clientHeight;
                    if (w > 0 && h > 0) return { width: w, height: h };
                }
                var s = computeSize();
                return { width: s.width, height: s.height };
            };

            document.documentElement.style.setProperty('--vp-w', window.innerWidth + 'px');
            document.documentElement.style.setProperty('--vp-h', window.innerHeight + 'px');

            function applyLayout() {
                var s = computeSize();
                var root = document.documentElement;
                if (s.forced) {
                    root.classList.add('force-landscape');
                    document.body.style.width = s.width + 'px';
                    document.body.style.height = s.height + 'px';
                } else {
                    root.classList.remove('force-landscape');
                    document.body.style.width = '';
                    document.body.style.height = '';
                }
                root.style.setProperty('--vp-w', s.width + 'px');
                root.style.setProperty('--vp-h', s.height + 'px');
                window.dispatchEvent(new Event('game-viewport-resize'));
            }

            function finishHint() {
                var hint = document.getElementById('rotateMessage');
                if (hint) {
                    hint.classList.add('hide');
                    window.setTimeout(function () {
                        hint.style.display = 'none';
                        applyLayout();
                    }, 320);
                } else {
                    applyLayout();
                }
            }

            if (isTouchDevice()) {
                window.setTimeout(finishHint, 1400);
            }

            window.addEventListener('resize', applyLayout);
            window.addEventListener('orientationchange', applyLayout);
        })();
    </script>
