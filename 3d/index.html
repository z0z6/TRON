<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TRON Light Cycles 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000011; }
        canvas { display: block; width: 100%; height: 100%; }

        #scoreHud {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #aef1ff;
            text-align: right;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        }

        #scoreHud .score { font-size: 32px; font-weight: bold; }
        #scoreHud .combo {
            font-size: 16px;
            color: #ffcc00;
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.7);
            min-height: 20px;
        }

        #effectsHud {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        #effectsHud .effect {
            font-family: monospace;
            font-size: 13px;
            color: #0f0;
            background: rgba(0, 20, 10, 0.7);
            border: 1px solid rgba(0, 255, 0, 0.5);
            border-radius: 4px;
            padding: 3px 10px;
        }

        #toastHud {
            position: fixed;
            top: 180px;
            right: 20px;
            z-index: 10;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;
            color: #ffee00;
            text-shadow: 0 0 10px rgba(255, 238, 0, 0.8);
            pointer-events: none;
            text-align: right;
            transition: opacity 0.15s linear;
        }

        #achievementToast {
            position: fixed;
            top: 30px;
            left: 50%;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, rgba(20, 10, 0, 0.95), rgba(40, 25, 0, 0.95));
            border: 1px solid rgba(255, 200, 0, 0.7);
            border-radius: 8px;
            padding: 12px 20px;
            box-shadow: 0 0 25px rgba(255, 200, 0, 0.4);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffe9b0;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -16px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        #achievementToast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        #achievementToast .icon { font-size: 28px; }
        #achievementToast .name { font-weight: bold; font-size: 15px; color: #ffd24a; }
        #achievementToast .desc { font-size: 13px; color: #d8c79a; }

        /* === TOUCH CONTROLS === */
        .touch-controls {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .touch-controls { display: block; }
        }

        .turn-pad {
            position: absolute;
            right: max(25px, env(safe-area-inset-right, 25px));
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .turn-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(80px, 12vw);
            height: min(80px, 12vw);
            background: rgba(0, 243, 255, 0.15);
            border: 3px solid rgba(0, 243, 255, 0.6);
            border-radius: 14px;
            color: #00f3ff;
            font-size: 2rem;
            touch-action: none;
            user-select: none;
            transition: all 0.1s ease;
        }

        .turn-btn:active, .turn-btn.pressed {
            background: rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
        }

        .fn-controls-3d {
            position: absolute;
            left: max(25px, env(safe-area-inset-left, 25px));
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }

        .fn-btn-3d {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: min(75px, 11vw);
            height: min(55px, 8vw);
            background: rgba(255, 0, 255, 0.15);
            border: 2px solid rgba(255, 0, 255, 0.6);
            border-radius: 10px;
            color: #ff77ff;
            touch-action: none;
            user-select: none;
            transition: all 0.1s ease;
        }

        .fn-btn-3d:active, .fn-btn-3d.pressed {
            background: rgba(255, 0, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
        }

        .fn-btn-3d .fn-icon-3d { font-size: 1.2rem; }
        .fn-btn-3d .fn-label-3d { font-size: 0.6rem; font-weight: bold; letter-spacing: 1px; }

        .touch-start-btn {
            display: none;
            position: fixed;
            left: 50%;
            bottom: max(120px, env(safe-area-inset-bottom, 120px));
            transform: translateX(-50%);
            z-index: 25;
            padding: clamp(14px, 4vw, 18px) clamp(36px, 10vw, 50px);
            background: rgba(0, 243, 255, 0.15);
            border: 3px solid #00f3ff;
            border-radius: 40px;
            color: #00f3ff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: bold;
            font-size: clamp(1rem, 3vw, 1.2rem);
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
            touch-action: none;
            user-select: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .touch-start-btn { display: block; }
        }
    </style>
  <script type="module" crossorigin src="/TRON/3d/assets/index-Cl0pjRZJ.js"></script>
</head>
<body>
    <div id="scoreHud">
        <div class="score" id="scoreValue">0</div>
        <div class="combo" id="comboValue"></div>
    </div>
    <div id="effectsHud"></div>
    <div id="toastHud"></div>
    <div id="achievementToast">
        <span class="icon" id="achievementIcon"></span>
        <div>
            <div class="name" id="achievementName"></div>
            <div class="desc" id="achievementDesc"></div>
        </div>
    </div>

    <div class="touch-controls" aria-hidden="true">
        <div class="turn-pad" id="turnPad">
            <button type="button" class="turn-btn" data-turn="left">◀</button>
            <button type="button" class="turn-btn" data-turn="right">▶</button>
        </div>
        <div class="fn-controls-3d">
            <button type="button" class="fn-btn-3d" id="fnRestart3d"><span class="fn-icon-3d">↻</span><span class="fn-label-3d">RESTART</span></button>
            <button type="button" class="fn-btn-3d" id="fnCamera3d"><span class="fn-icon-3d"></span><span class="fn-label-3d">KAMERA</span></button>
            <button type="button" class="fn-btn-3d" id="fnMute3d"><span class="fn-icon-3d">🔇</span><span class="fn-label-3d">WYCISZ</span></button>
            <button type="button" class="fn-btn-3d" id="fnLobby3d"><span class="fn-icon-3d">🌐</span><span class="fn-label-3d">SIEĆ</span></button>
        </div>
    </div>

    <button type="button" class="touch-start-btn" id="touchStartBtn">URUCHOM CYKL</button>

    <script>
        // Touch controls dla 3D
        document.querySelectorAll('.turn-btn').forEach((btn) => {
            const action = btn.dataset.turn === 'left' ? 'turnLeft' : 'turnRight';
            const press = (e) => {
                e.preventDefault();
                btn.classList.add('pressed');
                if (typeof window.game !== 'undefined') {
                    window.game.handlePlayerInput(action);
                }
            };
            const release = (e) => {
                e.preventDefault();
                btn.classList.remove('pressed');
            };
            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('touchcancel', release, { passive: false });
        });

        document.getElementById('touchStartBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (typeof window.game !== 'undefined' && !window.game.isStarted) {
                window.game.startSinglePlayer('medium');
            }
        }, { passive: false });

        document.getElementById('fnRestart3d').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (typeof window.game !== 'undefined' && !window.game.isMultiplayer) {
                window.game.restart('medium');
            }
        }, { passive: false });

        document.getElementById('fnCamera3d').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (typeof window.game !== 'undefined') {
                window.game.toggleCameraMode();
            }
        }, { passive: false });

        document.getElementById('fnMute3d').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (typeof window.game !== 'undefined') {
                window.game.toggleMute();
            }
        }, { passive: false });

        document.getElementById('fnLobby3d').addEventListener('touchstart', (e) => {
            e.preventDefault();
            // Lobby logic
        }, { passive: false });
    </script>
</body>
</html>
